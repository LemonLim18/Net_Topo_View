# backend/ansible/inventory/hosts.yml
# Static scaffold for manual / lab runs.
# The runtime pipeline uses a generated inventory dict from ansible/inventory.py.
---
all:
  vars:
    ansible_command_timeout: 60
    ansible_connect_timeout: 30

  children:
    vendor_cisco_ios:
      vars:
        ansible_network_os:      ios
        ansible_connection:      network_cli
        ansible_user:            "{{ vault_net_user }}"
        ansible_password:        "{{ vault_net_pass }}"
        ansible_become:          true
        ansible_become_method:   enable
        ansible_become_pass:     "{{ vault_enable_pass }}"
      hosts:
        core-sw-01:
          ansible_host: 10.0.0.1
        access-sw-02:
          ansible_host: 10.0.0.2
          canary: true   # preferred canary device

    vendor_cisco_nxos:
      vars:
        ansible_network_os:  nxos
        ansible_connection:  network_cli
        ansible_user:        "{{ vault_net_user }}"
        ansible_password:    "{{ vault_net_pass }}"
      hosts:
        dc-leaf-01:
          ansible_host: 10.1.0.1

    vendor_juniper_junos:
      vars:
        ansible_network_os:  junos
        ansible_connection:  netconf
        ansible_user:        "{{ vault_net_user }}"
        ansible_password:    "{{ vault_net_pass }}"
        ansible_port:        830
      hosts:
        edge-router-01:
          ansible_host: 10.0.1.1

    vendor_huawei_vrp:
      vars:
        ansible_network_os:  vrp
        ansible_connection:  network_cli
        ansible_user:        "{{ vault_net_user }}"
        ansible_password:    "{{ vault_net_pass }}"
      hosts:
        dist-sw-01:
          ansible_host: 10.0.2.1
