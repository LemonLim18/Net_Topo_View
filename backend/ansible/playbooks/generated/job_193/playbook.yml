---
- name: Configure Static Routes (Cisco IOS)
  hosts: "Acc_Cisco_2"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Configure static route (Cisco IOS)
      cisco.ios.ios_config:
        lines:
          - "ip route 0.0.0.0 0.0.0.0 Acc_Cisco_2:Ethernet0/3"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
