---
- name: Configure Static Routes (Cisco IOS)
  hosts: "Acc_Cisco_1"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Configure static route (Cisco IOS)
      cisco.ios.ios_config:
        lines:
          - >-
            
            ip route 10.10.10.0 255.255.255.0 192.168.1.1
            
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
