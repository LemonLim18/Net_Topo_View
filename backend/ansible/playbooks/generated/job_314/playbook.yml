---
# Cisco IOS only. Same behavior as multi_vendor: VLAN-only when no interfaces; data-driven interfaces when intent has them.
# Variables: vlan_id, vlan_name, target_hosts, interfaces_config_with_vlan (from get_template_vars).
- name: Configure VLANs on access switches
  hosts: "Cisco_Acc_1"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Ensure VLAN 10 exists (Cisco IOS)
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "10"
            name: "HR"
            state: active
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])

    - name: Configure interfaces (Cisco IOS)
      cisco.ios.ios_config:
        parents: "interface {{ item.name }}"
        lines:
          - switchport mode access
          - switchport trunk encapsulation dot1q
          - switchport mode trunk
          - "switchport trunk allowed vlan {{ vlan_id | default('10') | string }}"
      loop: "{{ interfaces_config_with_vlan | default([{'name': 'Ethernet0/2'}]) }}"
      when: 
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - interfaces_config_with_vlan is defined or (interfaces_config_with_vlan is not defined and item.name is defined)
