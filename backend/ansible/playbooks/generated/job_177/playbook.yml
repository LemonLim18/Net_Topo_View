---
- name: Configure OSPF (Cisco IOS)
  hosts: "Acc_Cisco_1"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Configure OSPF process and advertised networks (Cisco IOS)
      cisco.ios.ios_config:
        parents: "router ospf 1"
        lines:

          - "router-id 1.1.1.1"


          - "network 10.0.0.0 0.0.0.255 area 0"

      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])