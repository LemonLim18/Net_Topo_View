---
# VLAN 123 named CS on target hosts.
# LLM provides intent (vlan id/name, interfaces list). Template does not invent: interfaces empty => no interface config.
# Only vendors present in target hosts are included (vendors list).
- name: Configure VLANs on access switches
  hosts: "Acc_Cisco_1,Acc_Cisco_2,Acc_Cisco_5,Acc_Cisco_6,Acc_Huawei_3,Acc_Juniper_4"
  gather_facts: no
  ignore_unreachable: true
  tasks:

    - name: Ensure VLAN 123 exists (Cisco IOS)
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "123"
            name: "CS"
            state: active
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])




    - name: Ensure VLAN 123 exists (Huawei VRP)
      community.network.ce_config:
        lines:
          - vlan batch 123
          - vlan 123
          - name CS
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])





    - name: Ensure VLAN 123 exists (Juniper Junos)
      juniper.device.junos_vlans:
        config:
          - name: "CS"
            vlan_id: "123"
        state: merged
      when: inventory_hostname in groups.get('vendor_juniper_junos', [])


