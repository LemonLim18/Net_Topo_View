- name: Configure ACL (Cisco IOS)
  hosts: "Acc_Cisco_1"
  gather_facts: no
  connection: network_cli
  tasks:
    - name: Configure ACL on Cisco IOS
      cisco.ios.ios_config:
        lines:


        parents:
          - "ip access-list extended BLOCK_HTTP"
        lines:


          - "1 deny tcp any 0.0.0.0/0 any 0.0.0.0/0 eq eq 80"


