---
# Interface config — Cisco IOS only (single-vendor reference)
# First Jinja pass (reference_resolver): fills target_hosts, interfaces_config, interfaces_to_shutdown from intent.
# Ansible evaluates loop variables inside the raw block at run time (not during reference fill).
- name: Configure interfaces (Cisco IOS)
  hosts: "Acc_Cisco_1"
  gather_facts: no
  ignore_unreachable: true
  vars:
    interfaces_config: [{"name": "Ethernet0/2", "enabled": true, "mode": "routed", "ip": {"address": "192.168.1.69", "mask": "255.255.255.0"}}]
    interfaces_admin_enabled: "false"

    interfaces_to_shutdown: []

  tasks:

    - name: Configure L2 interface mode (Cisco IOS)
      cisco.ios.ios_config:
        parents: "interface {{ item.name }}"
        lines: "{{ [
          ('switchport mode access' if (item.mode is defined and item.mode == 'access') else ''),
          (('switchport access vlan ' ~ (item.access.vlan | string)) if (item.mode is defined and item.mode == 'access' and item.access is defined and item.access.vlan is defined) else ''),
          ('switchport trunk encapsulation dot1q' if (item.mode is defined and item.mode == 'trunk') else ''),
          ('switchport mode trunk' if (item.mode is defined and item.mode == 'trunk') else ''),
          (('switchport trunk allowed vlan add ' ~ ((item.trunk.allowed_vlans | default([]) | map('string') | join(',')))) if (item.mode is defined and item.mode == 'trunk' and item.trunk is defined and item.trunk.allowed_vlans is defined) else ''),
          (('switchport trunk native vlan ' ~ (item.trunk.native_vlan | string)) if (item.mode is defined and item.mode == 'trunk' and item.trunk is defined and item.trunk.native_vlan is defined) else '')
        ] | reject('equalto', '') | list }}"
      loop: "{{ interfaces_config | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - (interfaces_config | default([])) | length > 0
        - item.mode is defined
        - item.mode in ['access', 'trunk']

    - name: Configure routed interface (L3) (Cisco IOS)
      cisco.ios.ios_config:
        parents: "interface {{ item.name }}"
        lines: "{{ [
          'no switchport',
          (('ip address ' ~ (item.ip.address | string) ~ ' ' ~ ((item.ip.mask | default(item.ip.netmask) | default('')) | string)) if (item.ip is defined and item.ip.address is defined and (item.ip.mask is defined or item.ip.netmask is defined)) else ''),
          (('ip address ' ~ (item.ip_address | string) ~ ' ' ~ (item.subnet_mask | string)) if (item.ip_address is defined and item.subnet_mask is defined and item.ip is not defined) else '')
        ] | reject('equalto', '') | list }}"
      loop: "{{ interfaces_config | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - (interfaces_config | default([])) | length > 0
        - item.mode is defined
        - item.mode == 'routed'

    - name: Configure interface (Cisco IOS)
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            enabled: "{{ ((item.enabled | default(false) | string | trim | lower) in ['1', 'true', 'yes', 'on']) | string | lower }}"
        state: merged
      loop: "{{ interfaces_config | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - (interfaces_config | default([])) | length > 0

    - name: Shutdown interface (Cisco IOS)
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item }}"
            enabled: "{{ ((interfaces_admin_enabled | default(false) | string | trim | lower) in ['1', 'true', 'yes', 'on']) | string | lower }}"
        state: merged
      loop: "{{ interfaces_to_shutdown | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - (interfaces_config | default([])) | length == 0
        - (interfaces_to_shutdown | default([])) | length > 0
