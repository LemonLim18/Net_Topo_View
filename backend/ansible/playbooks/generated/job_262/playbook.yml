    - name: Apply ACL to Ethernet0/1 on Cisco IOS (replace semantics)
      cisco.ios.ios_config:
        match: none
        parents:
          - "interface Ethernet0/1"
        lines:
          - "no ip access-group"
          - "ip access-group BLOCK_HTTP out"

