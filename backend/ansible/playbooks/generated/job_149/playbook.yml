---
# Interface config — Cisco IOS only (single-vendor reference)
# First Jinja pass (reference_resolver): fills target_hosts, interfaces_config, interfaces_to_shutdown from intent.
# Ansible evaluates loop variables inside the raw block at run time (not during reference fill).
- name: Configure interfaces (Cisco IOS)
  hosts: "Acc_Cisco_1"
  gather_facts: no
  ignore_unreachable: true
  vars:
    interfaces_config: [{"name": "Acc_Cisco_1:Ethernet0/2", "enabled": true, "mode": "access"}, {"name": "Acc_Cisco_1:Ethernet0/3", "enabled": true, "mode": "access"}]
    interfaces_admin_enabled: "false"

    interfaces_to_shutdown: []

  tasks:

    - name: Configure interface (Cisco IOS)
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            enabled: "{{ ((item.enabled | default(false) | string | trim | lower) in ['1', 'true', 'yes', 'on']) | string | lower }}"
        state: merged
      loop: "{{ interfaces_config | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - (interfaces_config | default([])) | length > 0

    - name: Shutdown interface (Cisco IOS)
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item }}"
            enabled: "{{ ((interfaces_admin_enabled | default(false) | string | trim | lower) in ['1', 'true', 'yes', 'on']) | string | lower }}"
        state: merged
      loop: "{{ interfaces_to_shutdown | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - (interfaces_config | default([])) | length == 0
        - (interfaces_to_shutdown | default([])) | length > 0
