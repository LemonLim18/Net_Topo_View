- name: Configure ACL (Huawei VRP)
  hosts: "Acc_Huawei_3"
  gather_facts: no
  connection: ansible.netcommon.network_cli
  tasks:

    - name: Configure ACL on Huawei VRP
      community.network.ce_config:
        parents:
          - "acl name BLOCK_ICMP advance"
        lines:
          - "rule deny icmp source any destination any"

    - name: Apply ACL to interface
      community.network.ce_config:
        parents:
          - "interface GigabitEthernet1/0/3"
        lines:
          - "traffic-filter inbound acl name BLOCK_ICMP"