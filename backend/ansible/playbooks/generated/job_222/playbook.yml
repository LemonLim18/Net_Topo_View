- name: Configure ACL (Huawei VRP)
  hosts: "Acc_Huawei_3"
  gather_facts: no
  connection: network_cli
  tasks:
    - name: Configure ACL on Huawei VRP
      community.network.ce_config:
        lines:


          - "acl number 2000"



          - "rule 1 permit tcp source 192.168.1.0 0.0.0.255 destination any destination-port eq 22"


          - "return"