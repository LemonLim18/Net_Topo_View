- name: Configure ACL (Huawei VRP)
  hosts: "Acc_Huawei_3"
  gather_facts: no
  connection: network_cli
  tasks:
    - name: Pre-check ACL existence on Huawei VRP (for check-mode changed reporting)
      community.network.ce_command:
        commands:
          - "display current-configuration | include acl name BLOCK_ICMP"
      register: acl_precheck
      changed_when: false

    - name: Configure ACL on Huawei VRP
      community.network.ce_config:
        lines:




          - "undo acl name BLOCK_ICMP"
          - "acl name BLOCK_ICMP advance"



          - "rule 10 deny icmp source any destination any"


          - "return"

      register: acl_cfg_result
      vars:
        _acl_identifier: "acl name BLOCK_ICMP"
        _rules_requested: true

        _acl_cfg_text: "{{ (acl_precheck.stdout | default([])) | join('\n') }}"
        _acl_exists: "{{ _acl_identifier in _acl_cfg_text }}"
        _acl_would_change: "{{ (not (_acl_exists | bool)) or (_rules_requested | bool) }}"
      changed_when: "{{ (_acl_would_change | bool) if ansible_check_mode else (acl_cfg_result.changed | default(false)) }}"













    - name: Pre-check traffic-filter on GE1/0/3 (for check-mode changed reporting)
      community.network.ce_command:
        commands:
          - "display current-configuration interface GE1/0/3 | include traffic-filter"
      register: tf_precheck
      changed_when: false

    - name: Apply ACL to GE1/0/3 on Huawei VRP (replace semantics)
      community.network.ce_config:
        lines:
          - "interface GE1/0/3"
          - "traffic-filter inbound acl name BLOCK_ICMP"
          - "quit"
      register: tf_apply_result
      vars:
        _tf_expected_line: "traffic-filter inbound acl name BLOCK_ICMP"

        _tf_text: "{{ (tf_precheck.stdout | default([])) | join('\n') }}"
        _tf_would_change: "{{ _tf_expected_line not in _tf_text }}"
      changed_when: "{{ (_tf_would_change | bool) if ansible_check_mode else (tf_apply_result.changed | default(false)) }}"


