- name: Configure ACL (Cisco IOS)
  hosts: "Acc_Cisco_1"
  gather_facts: no
  connection: network_cli
  tasks:





    - name: Configure numbered ACL on Cisco IOS
      cisco.ios.ios_config:
        match: line
        replace: line
        lines:







    - name: Apply ACL to GigabitEthernet1/0/1 on Cisco IOS (replace semantics)
      cisco.ios.ios_config:
        match: none
        parents:
          - "interface GigabitEthernet1/0/1"
        lines:
          - "no ip access-group"
          - "ip access-group 3000 in"

