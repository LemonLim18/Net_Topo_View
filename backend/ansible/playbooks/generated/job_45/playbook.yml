---
# VLAN 67 named ShuYing on access switches; Cisco Gi0/1, Gi0/2; Huawei Gi1/0/1, Gi1/0/2
# Connection/ansible_network_os come from the pipeline inventory (build_inventory sets them per host).
- name: Configure VLANs on access switches
  hosts: "Acc_Cisco_1,Acc_Cisco_2,Acc_Huawei_3"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Ensure VLAN 67 exists (Cisco IOS)
      cisco.ios.ios_vlans:
        config:
          - vlan_id: '67'
            name: 'ShuYing'
            state: active
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])

    - name: Configure access VLAN on Gi0/1 and Gi0/2 (Cisco IOS)
      cisco.ios.ios_l2_interfaces:
        config:
          - name: GigabitEthernet0/1
            mode: access
            access:
              vlan: '67'
          - name: GigabitEthernet0/2
            mode: access
            access:
              vlan: '67'
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])

    - name: Ensure VLAN 67 exists (Huawei VRP)
      community.network.ce_config:
        lines:
          - vlan batch 67
          - vlan 67
          - name ShuYing
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])

    - name: Configure access VLAN on Gi1/0/1 (Huawei VRP)
      community.network.ce_config:
        lines:
          - port link-type access
          - port default vlan 67
        parents: interface GigabitEthernet1/0/1
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])

    - name: Configure access VLAN on Gi1/0/2 (Huawei VRP)
      community.network.ce_config:
        lines:
          - port link-type access
          - port default vlan 67
        parents: interface GigabitEthernet1/0/2
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])

    - name: Ensure VLAN 67 exists (Juniper Junos)
      juniper.device.junos_vlans:
        config:
          - name: 'ShuYing'
            vlan_id: '67'
        state: merged
      when: inventory_hostname in groups.get('vendor_juniper_junos', [])

    - name: Configure access VLAN on ge-0/0/0 and ge-0/0/1 (Juniper Junos)
      juniper.device.junos_l2_interfaces:
        config:
          - name: ge-0/0/0
            access:
              vlan: '67'
          - name: ge-0/0/1
            access:
              vlan: '67'
        state: merged
      when: inventory_hostname in groups.get('vendor_juniper_junos', [])