# backend/ansible/ansible.cfg
# Ansible configuration for NetTopoView campus network automation.
# Copy to the playbook directory or set ANSIBLE_CONFIG env var.

[defaults]
inventory           = inventory/hosts.yml
roles_path          = roles
collections_paths   = ~/.ansible/collections:/usr/share/ansible/collections
host_key_checking   = False
timeout             = 30
retry_files_enabled = False
stdout_callback     = yaml
callbacks_enabled   = profile_tasks, timer
gathering           = explicit        # NEVER auto-gather facts on network devices
interpreter_python  = auto_silent

# Vault password file — override with ANSIBLE_VAULT_PASSWORD_FILE env var
# vault_password_file = ~/.vault_pass

[persistent_connection]
connect_timeout     = 30
command_timeout     = 60

[ssh_connection]
# Legacy device negotiation: allow older KEX, host key, cipher, MAC so old network kit can connect
ssh_args            = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o KexAlgorithms=+diffie-hellman-group-exchange-sha1,diffie-hellman-group14-sha1,diffie-hellman-group1-sha1 -o HostKeyAlgorithms=+ssh-rsa -o Ciphers=+aes128-cbc,3des-cbc,aes192-cbc,aes256-cbc -o MACs=+hmac-sha1,hmac-sha1-96,hmac-md5,hmac-md5-96
pipelining          = False          # must be False for network devices

[colors]
highlight     = white
verbose       = blue
warn          = orange
error         = red
debug         = dark gray
deprecate     = purple
skip          = cyan
unreachable   = red
ok            = green
changed       = yellow
diff_add      = green
diff_remove   = red
