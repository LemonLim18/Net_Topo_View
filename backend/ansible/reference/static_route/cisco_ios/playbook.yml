---
- name: Configure Static Routes (Cisco IOS)
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Configure static route (Cisco IOS)
      cisco.ios.ios_config:
        lines:
          - "{% if vrf_name %}ip route vrf {{ vrf_name }} {{ destination_network }} {{ destination_netmask }} {{ next_hop }}{% if admin_distance is not none %} {{ admin_distance }}{% endif %}{% else %}ip route {{ destination_network }} {{ destination_netmask }} {{ next_hop }}{% if admin_distance is not none %} {{ admin_distance }}{% endif %}{% endif %}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])

