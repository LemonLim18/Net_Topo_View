---
# Interface — multi-vendor (shutdown and multi-scenario: description, access/trunk, IP).
# Huawei uses reference template: per-interface description / shutdown|undo shutdown / mode / IP.
# Vars: interfaces_config = [ { name, description?, enabled?, mode?, access?: { vlan }, trunk?: { allowed_vlans }, ip?: { address, mask } } ], or interfaces_to_shutdown = [ names ].
- name: Configure interfaces
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: no
  ignore_unreachable: true
  vars:
    interfaces_config_defaults: {{ interfaces_config_override | default([]) | tojson }}
    interfaces_config: {{ interfaces_config_override | default([]) | tojson }}
    interfaces_admin_enabled: "{{ ((interfaces_admin_enabled | default(false) | string | trim | lower) in ['1', 'true', 'yes', 'on']) | string | lower }}"
{% if interfaces_config_use_nettopo | default(false) %}
    # Per-host expanded config from nettopo_interfaces (mgmt excluded by name + mgmt IP match).
    interfaces_config: "{{ '{{ [ ((interfaces_config_defaults | default([]) | first | default({})) | combine({''name'': n})) for n in (nettopo_interfaces | default([]) | rejectattr(''ip_address'', ''equalto'', (hostvars[inventory_hostname].ansible_host | default(''''))) | map(attribute=''name'') | map(''trim'') | reject(''equalto'', '''') | reject(''match'', ''(?i).*(management|mgmt|meth|vty|console).*'') | list) ] }}' }}"
{% endif %}
{% if interfaces_to_shutdown_override is defined and interfaces_to_shutdown_override is not none and interfaces_to_shutdown_override | length > 0 %}
    interfaces_to_shutdown: {{ interfaces_to_shutdown_override | tojson }}
{% else %}
    interfaces_to_shutdown: "{{ '{{ nettopo_interfaces | default([]) | rejectattr(''ip_address'', ''equalto'', (hostvars[inventory_hostname].ansible_host | default(''''))) | map(attribute=''name'') | map(''trim'') | reject(''equalto'', '''') | reject(''match'', ''(?i).*(management|mgmt|meth|vty|console).*'') | list }}' }}"
{% endif %}
  tasks:
{% raw %}
    - name: Configure L2 interface mode (Cisco IOS)
      cisco.ios.ios_config:
        parents: "interface {{ item.name }}"
        lines: "{{ [
          ('switchport mode access' if (item.mode is defined and item.mode == 'access') else ''),
          (('switchport access vlan ' ~ (item.access.vlan | string)) if (item.mode is defined and item.mode == 'access' and item.access is defined and item.access.vlan is defined) else ''),
          ('switchport trunk encapsulation dot1q' if (item.mode is defined and item.mode == 'trunk') else ''),
          ('switchport mode trunk' if (item.mode is defined and item.mode == 'trunk') else ''),
          (('switchport trunk allowed vlan add ' ~ ((item.trunk.allowed_vlans | default([]) | map('string') | join(',')))) if (item.mode is defined and item.mode == 'trunk' and item.trunk is defined and item.trunk.allowed_vlans is defined) else ''),
          (('switchport trunk native vlan ' ~ (item.trunk.native_vlan | string)) if (item.mode is defined and item.mode == 'trunk' and item.trunk is defined and item.trunk.native_vlan is defined) else '')
        ] | reject('equalto', '') | list }}"
      loop: "{{ interfaces_config | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - (interfaces_config | default([])) | length > 0
        - item.mode is defined
        - item.mode in ['access', 'trunk']

    - name: Shutdown interface (Cisco IOS)
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item }}"
            enabled: "{{ ((interfaces_admin_enabled | default(false) | string | trim | lower) in ['1', 'true', 'yes', 'on']) | string | lower }}"
        state: merged
      loop: "{{ interfaces_to_shutdown | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - (interfaces_to_shutdown | default([])) | length > 0
{% endraw %}

# Huawei VRP — multi-scenario (description, shutdown, access/trunk, IP) per reference template
{% if interfaces_config_use_nettopo | default(false) %}
{% raw %}
    - name: Configure interface (Huawei VRP) [all interfaces]
      community.network.ce_config:
        parents: "interface {{ item.name }}"
        lines: "{{ [
          (('description ' ~ item.description) if (item.description is defined and item.description) else none),
          ('shutdown' if (item.enabled is defined and item.enabled == false) else 'undo shutdown'),
          ('port link-type access' if (item.mode is defined and item.mode == 'access') else none),
          (('port default vlan ' ~ (item.access.vlan | string)) if (item.mode is defined and item.mode == 'access' and item.access is defined and item.access.vlan is defined) else none),
          ('port link-type trunk' if (item.mode is defined and item.mode == 'trunk') else none),
          (('port trunk allow-pass vlan ' ~ ((item.trunk.allowed_vlans | default(item.trunk.allow_pass_vlans) | default([]) | map('string') | join(' ')))) if (item.mode is defined and item.mode == 'trunk' and item.trunk is defined) else none),
          (('ip address ' ~ (item.ip.address | string) ~ ' ' ~ ((item.ip.mask | default(item.ip.netmask) | default('255.255.255.0')) | string)) if (item.ip is defined and item.ip.address is defined) else none)
        ] | reject('equalto', none) | list }}"
      loop: "{{ interfaces_config | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
        - item.enabled is defined
{% endraw %}
{% else %}
{% for item in interfaces_config | default([]) %}
{% set ns = namespace(lines=[]) %}
{% if item.description is defined and item.description %}{% set _ = ns.lines.append('description ' + (item.description | string)) %}{% endif %}
{% if item.enabled is defined and item.enabled == false %}{% set _ = ns.lines.append('shutdown') %}{% elif item.enabled is defined and item.enabled != false %}{% set _ = ns.lines.append('undo shutdown') %}{% endif %}
{% if item.mode is defined and item.mode == 'access' and item.access is defined %}{% set _ = ns.lines.append('port link-type access') %}{% set _ = ns.lines.append('port default vlan ' + (item.access.vlan | string)) %}{% elif item.mode is defined and item.mode == 'trunk' and item.trunk is defined %}{% set _ = ns.lines.append('port link-type trunk') %}{% set _ = ns.lines.append('port trunk allow-pass vlan ' + (item.trunk.allowed_vlans | default(item.trunk.allow_pass_vlans) | default([]) | map('string') | join(' '))) %}{% endif %}
{% if item.ip is defined and item.ip and item.ip.address is defined %}{% set _ = ns.lines.append('ip address ' + (item.ip.address | string) + ' ' + (item.ip.mask | default(item.ip.netmask) | default('255.255.255.0') | string)) %}{% endif %}
    - name: Configure interface {{ item.name }} (Huawei VRP)
      community.network.ce_config:
        parents: "interface {{ item.name }}"
        lines: {{ ns.lines | tojson }}
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
        - ns.lines | length > 0
{% endfor %}
{% endif %}
{% raw %}
    - name: Shutdown interface (Huawei VRP)
      community.network.ce_config:
        lines:
          - "{{ 'shutdown' if (interfaces_admin_enabled | default(false)) == false else 'undo shutdown' }}"
        parents: "interface {{ item }}"
        state: merged
      loop: "{{ interfaces_to_shutdown | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
        - (interfaces_config | default([])) | length == 0
        - (interfaces_to_shutdown | default([])) | length > 0

    - name: Shutdown interface (Juniper Junos)
      juniper.device.junos_interfaces:
        config:
          - name: "{{ item }}"
            enabled: "{{ ((interfaces_admin_enabled | default(false) | string | trim | lower) in ['1', 'true', 'yes', 'on']) | string | lower }}"
        state: merged
      loop: "{{ interfaces_to_shutdown | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - inventory_hostname in groups.get('vendor_juniper_junos', [])
        - (interfaces_to_shutdown | default([])) | length > 0
{% endraw %}
