---
# Interface config — Huawei VRP (multi-scenario: description, shutdown, access/trunk, IP).
# Reference template logic (per interface):
#   interface {{ item.name }}
#   {% if item.description %}description {{ item.description }}{% endif %}
#   {% if item.enabled == false %}shutdown{% else %}undo shutdown{% endif %}
#   {% if item.mode == 'access' %}port link-type access; port default vlan {{ item.access.vlan }}{% elif item.mode == 'trunk' %}port link-type trunk; port trunk allow-pass vlan {{ item.trunk.allowed_vlans | join(' ') }}{% endif %}
#   {% if item.ip %}ip address {{ item.ip.address }} {{ item.ip.mask }}{% endif %}
# Vars: interfaces_config = [ { name, description?, enabled?, mode?, access?: { vlan }, trunk?: { allowed_vlans }, ip?: { address, mask } } ], or interfaces_to_shutdown = [ names ].
- name: Configure interfaces (Huawei VRP)
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: no
  ignore_unreachable: true
  tasks:
# Multi-scenario (interfaces_config)
{% for item in interfaces_config | default([]) %}
{% set ns = namespace(lines=[]) %}
{% if item.description is defined and item.description %}{% set _ = ns.lines.append('description ' + (item.description | string)) %}{% endif %}
{% if item.enabled is defined and item.enabled == false %}{% set _ = ns.lines.append('shutdown') %}{% elif item.enabled is defined and item.enabled != false %}{% set _ = ns.lines.append('undo shutdown') %}{% endif %}
{% if item.mode is defined and item.mode == 'access' and item.access is defined %}{% set _ = ns.lines.append('port link-type access') %}{% set _ = ns.lines.append('port default vlan ' + (item.access.vlan | string)) %}{% elif item.mode is defined and item.mode == 'trunk' and item.trunk is defined %}{% set _ = ns.lines.append('port link-type trunk') %}{% set _ = ns.lines.append('port trunk allow-pass vlan ' + (item.trunk.allowed_vlans | default(item.trunk.allow_pass_vlans) | default([]) | map('string') | join(' '))) %}{% endif %}
{% if item.ip is defined and item.ip and item.ip.address is defined %}{% set _ = ns.lines.append('ip address ' + (item.ip.address | string) + ' ' + (item.ip.mask | default(item.ip.netmask) | default('255.255.255.0') | string)) %}{% endif %}
    - name: Configure interface {{ item.name }} (Huawei VRP)
      community.network.ce_config:
        parents: "interface {{ item.name }}"
        lines: {{ ns.lines | tojson }}
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
        - ns.lines | length > 0
{% endfor %}
# Shutdown-only fallback (interfaces_to_shutdown = list of names)
    - name: Shutdown interface (Huawei VRP)
      community.network.ce_config:
        lines:
          - shutdown
        parents: "interface {{ item }}"
        state: merged
      loop: "{{ interfaces_to_shutdown | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
        - (interfaces_config | default([])) | length == 0
        - (interfaces_to_shutdown | default([])) | length > 0
