- name: Configure ACL / firewall (multi-vendor)
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: no
  tasks:
    # If only attachment is requested (apply_to/interfaces present but rules empty), do NOT delete ACL definitions.
    # Replace semantics applies to the attachment on the interface.
    - name: Configure numbered ACL on Cisco IOS
      cisco.ios.ios_config:
        match: none
        lines:
          - "no access-list {{ acl_name }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - ((acl_name | string) | trim).isdigit()
        - rules is defined
        - (rules | length) > 0

    - name: Apply numbered ACL on Cisco IOS
      cisco.ios.ios_config:
        match: line
        replace: line
        lines:
{% for rule in rules %}
{% if rule is string %}
          - "{{ rule }}"
{% else %}
{% set _src = (rule.source | default('any') | string) %}
{% set _dst = (rule.destination | default('any') | string) %}
{% set _src_wc = (rule.source_wildcard | default('') | string) %}
{% set _dst_wc = (rule.dest_wildcard | default('') | string) %}
{% set _src_part = _src if (_src | lower) == 'any' else (_src ~ (' ' ~ _src_wc if _src_wc else '')) %}
{% set _dst_part = _dst if (_dst | lower) == 'any' else (_dst ~ (' ' ~ _dst_wc if _dst_wc else '')) %}
{% set _port = (rule.port | default('') | string) %}
{% set _port_part = (' eq ' ~ _port) if (_port and not (_port | lower).startswith('eq')) else ((' ' ~ _port) if _port else '') %}
          - "access-list {{ acl_name }} {{ rule.action }}{% if rule.protocol is defined %} {{ rule.protocol }}{% endif %} {{ _src_part }} {{ _dst_part }}{{ _port_part }}{% if rule.log is defined and rule.log %} log{% endif %}"
{% endif %}
{% endfor %}
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - ((acl_name | string) | trim).isdigit()

    - name: Configure named ACL on Cisco IOS
      cisco.ios.ios_config:
        match: none
        lines:
          - "no ip access-list extended {{ acl_name }}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - not (((acl_name | string) | trim).isdigit())
        - rules is defined
        - (rules | length) > 0

    - name: Apply named ACL on Cisco IOS
      cisco.ios.ios_config:
        match: line
        replace: line
        parents:
          - "ip access-list extended {{ acl_name }}"
        lines:
{% set ns = namespace(has_deny=false, has_permit_any_any=false) %}
{% for rule in rules %}
{% if rule is string %}
          - "{{ rule }}"
{% else %}
{% set _src = (rule.source | default('any') | string) %}
{% set _dst = (rule.destination | default('any') | string) %}
{% set _src_wc = (rule.source_wildcard | default('') | string) %}
{% set _dst_wc = (rule.dest_wildcard | default('') | string) %}
{% set _src_part = _src if (_src | lower) == 'any' else (_src ~ (' ' ~ _src_wc if _src_wc else '')) %}
{% set _dst_part = _dst if (_dst | lower) == 'any' else (_dst ~ (' ' ~ _dst_wc if _dst_wc else '')) %}
{% set _port = (rule.port | default('') | string) %}
{% set _port_part = (' eq ' ~ _port) if (_port and not (_port | lower).startswith('eq')) else ((' ' ~ _port) if _port else '') %}
{% set _seq_raw = (rule.seq | string) if (rule.seq is defined and (rule.seq | string) | trim) else '' %}
{% set _seq_num = (_seq_raw | int) if _seq_raw else 0 %}
{% set _seq = (_seq_raw if _seq_num >= 10 else ((loop.index * 10) | string)) %}
{% if (rule.action | default('') | string | lower) == 'deny' %}{% set ns.has_deny = true %}{% endif %}
{% if (rule.action | default('') | string | lower) == 'permit' and (rule.protocol | default('') | string | lower) == 'ip' and (_src | lower) == 'any' and (_dst | lower) == 'any' %}{% set ns.has_permit_any_any = true %}{% endif %}
          - "{{ _seq }} {{ rule.action }}{% if rule.protocol is defined %} {{ rule.protocol }}{% endif %} {{ _src_part }} {{ _dst_part }}{{ _port_part }}{% if rule.log is defined and rule.log %} log{% endif %}"
{% endif %}
{% endfor %}
{% if ns.has_deny and not ns.has_permit_any_any %}
          - "{{ ((rules | length) + 1) * 10 }} permit ip any any"
{% endif %}
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
        - not (((acl_name | string) | trim).isdigit())

{% for ap in (apply_to or []) %}
{% if ap is string %}
{% set _tok = (ap | string) %}
{% set _parts = _tok.split() %}
{% set _last = (_parts[-1] if (_parts | length) > 0 else '') %}
{% set _dir = (_last if _last in ['in','out'] else (acl_direction | default('in'))) %}
{% set _iface_tok = (' '.join(_parts[:-1]) if _last in ['in','out'] else _tok) %}
{% set _iface = (_iface_tok.split(':', 1)[1] if ':' in _iface_tok else _iface_tok) %}
{% else %}
{% set _iface = (ap.interface | default(ap.get('interface')) | default(ap.get('name')) | string) %}
{% set _dir = (ap.direction | default(ap.get('direction')) | default(acl_direction | default('in')) | string) %}
{% endif %}
{% if _iface | trim %}
    - name: Apply ACL to {{ _iface }} on Cisco IOS (replace semantics)
      cisco.ios.ios_config:
        match: none
        parents:
          - "interface {{ _iface }}"
        lines:
          - "{% if (acl_type | default('ipv4') | lower) == 'ipv6' %}no ipv6 traffic-filter{% else %}no ip access-group{% endif %}"
          - "{% if (acl_type | default('ipv4') | lower) == 'ipv6' %}ipv6 traffic-filter {{ acl_name }} {{ _dir }}{% else %}ip access-group {{ acl_name }} {{ _dir }}{% endif %}"
      when:
        - inventory_hostname in groups.get('vendor_cisco_ios', [])
{% endif %}
{% endfor %}

    - name: Pre-check ACL existence on Huawei VRP (for check-mode changed reporting)
      community.network.ce_command:
        commands:
          - "display current-configuration | include acl {% if ((acl_name | string) | trim).isdigit() %}number{% else %}name{% endif %} {{ acl_name }}"
      register: acl_precheck_huawei
      changed_when: false
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])

    - name: Configure ACL on Huawei VRP
      community.network.ce_config:
        lines:
{% set _is_numbered_hw = ((acl_name | string) | trim).isdigit() %}
{% if _is_numbered_hw %}
          - "undo acl number {{ acl_name }}"
          - "acl number {{ acl_name }}"
{% else %}
          - "undo acl name {{ acl_name }}"
          - "acl name {{ acl_name }} {{ 'advance' if acl_type in ['ipv4','extended'] else acl_type }}"
{% endif %}
{% for rule in rules %}
{% if rule is string %}
          - "{{ rule }}"
{% else %}
{% set _rule_seq_hw = (rule.seq if rule.seq is defined else (loop.index * 10)) %}
          - "rule {{ _rule_seq_hw }} {{ rule.action }} {% if rule.protocol is defined %}{{ rule.protocol }} {% endif %}source {{ rule.source }}{% if rule.source_wildcard is defined %} {{ rule.source_wildcard }}{% endif %}{% if rule.destination is defined %} destination {{ rule.destination }}{% endif %}{% if rule.dest_wildcard is defined %} {{ rule.dest_wildcard }}{% endif %}{% if rule.port is defined %} destination-port eq {{ rule.port }}{% endif %}{% if rule.log is defined and rule.log %} logging{% endif %}"
{% endif %}
{% endfor %}
          - "return"
      register: acl_cfg_result_huawei
      vars:
        _acl_identifier: "acl {% if _is_numbered_hw %}number{% else %}name{% endif %} {{ acl_name }}"
        _rules_requested: {% if (rules is defined) and ((rules | length) > 0) %}true{% else %}false{% endif %}
{% raw %}
        _acl_cfg_text: "{{ (acl_precheck_huawei.stdout | default([])) | join('\n') }}"
        _acl_exists: "{{ _acl_identifier in _acl_cfg_text }}"
        _acl_would_change: "{{ (not (_acl_exists | bool)) or (_rules_requested | bool) }}"
      changed_when: "{{ (_acl_would_change | bool) if ansible_check_mode else (acl_cfg_result_huawei.changed | default(false)) }}"
{% endraw %}
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
        - rules is defined
        - (rules | length) > 0

{% for ap in (apply_to or []) %}
{% if ap is string %}
{% set _tok = (ap | string) %}
{% set _parts = _tok.split() %}
{% set _last = (_parts[-1] if (_parts | length) > 0 else '') %}
{% set _dir = (_last if _last in ['in','out'] else (acl_direction | default('in'))) %}
{% set _iface_tok = (' '.join(_parts[:-1]) if _last in ['in','out'] else _tok) %}
{% set _iface = (_iface_tok.split(':', 1)[1] if ':' in _iface_tok else _iface_tok) %}
{% else %}
{% set _iface = (ap.interface | default(ap.get('interface')) | default(ap.get('name')) | string) %}
{% set _dir = (ap.direction | default(ap.get('direction')) | default(acl_direction | default('in')) | string) %}
{% endif %}
{% set _iface_hw = (_iface | replace('TenGigabitEthernet', '10GE') | replace('GigabitEthernet', 'GE')) %}
{% if _iface_hw | trim %}
    - name: Pre-check traffic-filter on {{ _iface_hw }} (for check-mode changed reporting)
      community.network.ce_command:
        commands:
          - "display current-configuration interface {{ _iface_hw }} | include traffic-filter"
      register: tf_precheck_huawei
      changed_when: false
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])

    - name: Apply ACL to {{ _iface_hw }} on Huawei VRP (replace semantics)
      community.network.ce_config:
        lines:
          - "interface {{ _iface_hw }}"
          - "traffic-filter {{ 'inbound' if _dir in ['in', 'inbound'] else 'outbound' }} acl{% if ((acl_name | string) | trim).isdigit() %} {{ acl_name }}{% else %} name {{ acl_name }}{% endif %}"
          - "quit"
      register: tf_apply_result_huawei
      vars:
        _tf_expected_line: "traffic-filter {{ 'inbound' if _dir in ['in', 'inbound'] else 'outbound' }} acl{% if ((acl_name | string) | trim).isdigit() %} {{ acl_name }}{% else %} name {{ acl_name }}{% endif %}"
{% raw %}
        _tf_text: "{{ (tf_precheck_huawei.stdout | default([])) | join('\n') }}"
        _tf_would_change: "{{ _tf_expected_line not in _tf_text }}"
      changed_when: "{{ (_tf_would_change | bool) if ansible_check_mode else (tf_apply_result_huawei.changed | default(false)) }}"
{% endraw %}
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
{% endif %}
{% endfor %}

    - name: Configure firewall filter on Juniper Junos
      junipernetworks.junos.junos_config:
        lines:
          - "delete firewall family inet filter {{ acl_name }}"
{% for rule in rules %}
{% if rule is string %}
          - "{{ rule }}"
{% else %}
{% set term = ('t' ~ (rule.seq | string)) if (rule.seq is defined) else ('t' ~ (loop.index | string)) %}
{% if rule.source is defined and (rule.source | string | lower) != 'any' %}
          - "set firewall family inet filter {{ acl_name }} term {{ term }} from source-address {{ rule.source }}/32"
{% endif %}
{% if rule.destination is defined and (rule.destination | string) != 'any' %}
          - "set firewall family inet filter {{ acl_name }} term {{ term }} from destination-address {{ rule.destination }}/32"
{% endif %}
{% if rule.protocol is defined %}
          - "set firewall family inet filter {{ acl_name }} term {{ term }} from protocol {{ rule.protocol }}"
{% endif %}
{% if rule.port is defined %}
          - "set firewall family inet filter {{ acl_name }} term {{ term }} from destination-port {{ rule.port }}"
{% endif %}
          - "set firewall family inet filter {{ acl_name }} term {{ term }} then {{ 'accept' if rule.action == 'permit' else 'discard' }}"
{% endif %}
{% endfor %}
      when:
        - inventory_hostname in groups.get('vendor_juniper_junos', [])
        - rules is defined
        - (rules | length) > 0

{% for ap in (apply_to or []) %}
{% if ap is string %}
{% set _tok = (ap | string) %}
{% set _parts = _tok.split() %}
{% set _last = (_parts[-1] if (_parts | length) > 0 else '') %}
{% set _dir = (_last if _last in ['in','out'] else (acl_direction | default('in'))) %}
{% set _iface_tok = (' '.join(_parts[:-1]) if _last in ['in','out'] else _tok) %}
{% set _iface = (_iface_tok.split(':', 1)[1] if ':' in _iface_tok else _iface_tok) %}
{% else %}
{% set _iface = (ap.interface | default(ap.get('interface')) | default(ap.get('name')) | string) %}
{% set _dir = (ap.direction | default(ap.get('direction')) | default(acl_direction | default('in')) | string) %}
{% endif %}
{% if _iface | trim %}
    - name: Apply firewall filter to {{ _iface }} on Juniper Junos (replace semantics)
      junipernetworks.junos.junos_config:
        lines:
          - "delete interfaces {{ _iface }} unit 0 family inet filter"
          - "set interfaces {{ _iface }} unit 0 family inet filter {{ 'input' if _dir in ['in', 'inbound'] else 'output' }} {{ acl_name }}"
      when:
        - inventory_hostname in groups.get('vendor_juniper_junos', [])
{% endif %}
{% endfor %}
