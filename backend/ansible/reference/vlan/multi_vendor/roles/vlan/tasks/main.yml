---
# VLAN role: vendor-aware via ansible_network_os (inventory). Receives vlan + interfaces only.
# Configure interfaces only when interfaces | length > 0 (no invented ports).

# --- Ensure VLAN exists (vendor-specific) ---
- name: Ensure VLAN exists (Cisco IOS)
  cisco.ios.ios_vlans:
    config:
      - vlan_id: "{{ vlan.id }}"
        name: "{{ vlan.name | default('') }}"
        state: active
    state: merged
  when: "'cisco' in (ansible_network_os | default('')) or 'ios' in (ansible_network_os | default(''))"

- name: Ensure VLAN exists (Huawei CE/VRP)
  community.network.ce_config:
    lines:
      - vlan batch {{ vlan.id }}
      - vlan {{ vlan.id }}
      - name {{ vlan.name | default('') }}
  when: "'huawei' in (ansible_network_os | default('')) or 'ce' in (ansible_network_os | default(''))"

- name: Ensure VLAN exists (Juniper Junos)
  juniper.device.junos_config:
    lines:
      - set vlans {{ vlan.name | default('VLAN' ~ (vlan.id | string)) }} vlan-id {{ vlan.id }}
  when: "'junos' in (ansible_network_os | default('')) or 'juniper' in (ansible_network_os | default(''))"

# --- Build L2 config from schema-shaped interfaces (only when user provided interfaces) ---
- name: Initialize L2 config list
  set_fact:
    _l2_config: []
  when: interfaces | default([]) | length > 0

- name: Build L2 config from intent (access ports)
  set_fact:
    _l2_config: "{{ _l2_config + [{'name': item.name, 'mode': 'access', 'access': {'vlan': (item.access_vlan | default(vlan.id)) | string}}] }}"
  loop: "{{ interfaces | default([]) }}"
  when:
    - interfaces | default([]) | length > 0
    - (item.mode | default('access')) == 'access'

- name: Build L2 config from intent (trunk ports)
  set_fact:
    _l2_config: "{{ _l2_config + [{'name': item.name, 'mode': 'trunk', 'trunk': _trunk_dict}] }}"
  vars:
    _tv: "{{ 'all' if (item.allowed_vlans is defined and item.allowed_vlans is string and (item.allowed_vlans | lower == 'all')) else ((item.allowed_vlans | default([]) | map('string') | list | join(',')) if (item.allowed_vlans is not string and item.allowed_vlans | default([]) | length > 0) else (vlan.id | string)) }}"
    _trunk_dict: "{{ {'allowed_vlans': _tv} | combine({'native_vlan': item.native_vlan | int}) if (item.native_vlan is defined and item.native_vlan is not none) else {'allowed_vlans': _tv} }}"
  loop: "{{ interfaces | default([]) }}"
  when:
    - interfaces | default([]) | length > 0
    - (item.mode | default('access')) == 'trunk'

# --- Apply interface config (vendor-specific, only when interfaces defined) ---
- name: Configure L2 interfaces (Cisco IOS)
  cisco.ios.ios_l2_interfaces:
    config: "{{ _l2_config }}"
    state: merged
  when:
    - interfaces | default([]) | length > 0
    - _l2_config | default([]) | length > 0
    - "'cisco' in (ansible_network_os | default('')) or 'ios' in (ansible_network_os | default(''))"

- name: Configure L2 interfaces (Huawei CE/VRP) — per interface
  community.network.ce_config:
    lines:
      - port link-type access
      - port default vlan {{ (item.access_vlan | default(vlan.id)) | string }}
    parents: "interface {{ item.name }}"
  loop: "{{ interfaces | default([]) }}"
  when:
    - interfaces | default([]) | length > 0
    - (item.mode | default('access')) == 'access'
    - "'huawei' in (ansible_network_os | default('')) or 'ce' in (ansible_network_os | default(''))"

- name: Configure access interfaces (Juniper Junos)
  juniper.device.junos_config:
    lines:
      - set interfaces {{ item.name }} unit 0 family ethernet-switching port-mode access
      - set interfaces {{ item.name }} unit 0 family ethernet-switching vlan members {{ vlan.name | default(vlan.id | string) }}
  loop: "{{ interfaces | default([]) }}"
  when:
    - interfaces | default([]) | length > 0
    - (item.mode | default('access')) == 'access'
    - "'junos' in (ansible_network_os | default('')) or 'juniper' in (ansible_network_os | default(''))"

- name: Configure trunk interfaces (Juniper Junos)
  juniper.device.junos_config:
    lines: "{{ [
      ('set interfaces ' ~ item.name ~ ' unit 0 family ethernet-switching port-mode trunk'),
      ('set interfaces ' ~ item.name ~ ' unit 0 family ethernet-switching vlan members ' ~ _juniper_trunk_members),
      (('set interfaces ' ~ item.name ~ ' native-vlan-id ' ~ (item.native_vlan | string)) if (item.native_vlan is defined and item.native_vlan is not none) else '')
    ] | reject('equalto', '') | list }}"
  vars:
    _juniper_trunk_members: >-
      {{
        'all'
        if (item.allowed_vlans is defined and item.allowed_vlans is string and (item.allowed_vlans | lower == 'all'))
        else (
          '[ ' ~ ((item.allowed_vlans | default([]) | map('string') | join(' ')) | trim) ~ ' ]'
          if (item.allowed_vlans is defined and item.allowed_vlans is not string and (item.allowed_vlans | default([]) | length > 0))
          else ('[ ' ~ (vlan.name | default(vlan.id | string)) ~ ' ]')
        )
      }}
  loop: "{{ interfaces | default([]) }}"
  when:
    - interfaces | default([]) | length > 0
    - (item.mode | default('access')) == 'trunk'
    - "'junos' in (ansible_network_os | default('')) or 'juniper' in (ansible_network_os | default(''))"
