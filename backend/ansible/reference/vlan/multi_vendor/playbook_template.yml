---
# VLAN {{ vlan_id }} named {{ vlan_name }} on target hosts.
# LLM provides intent (vlan id/name, interfaces list). Template does not invent: interfaces empty => no interface config.
# Only vendors present in target hosts are included (vendors list).
- name: Configure VLANs on access switches
  hosts: "{{ target_hosts }}"
  gather_facts: no
  ignore_unreachable: true
  tasks:
{% if 'cisco_ios' in vendors %}
    - name: Ensure VLAN {{ vlan_id }} exists (Cisco IOS)
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ vlan_id }}"
            name: "{{ vlan_name }}"
            state: active
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])

{% if interfaces_config_with_vlan_use_nettopo | default(false) %}
{% set iface_names = nettopo_interfaces | default([]) | rejectattr('ip_address', 'equalto', (hostvars[inventory_hostname].ansible_host | default(''))) | map(attribute='name') | map('trim') | reject('equalto', '') | reject('match', '(?i).*(management|mgmt|meth|vty|console).*') | list %}
    - name: Configure all interfaces for VLAN {{ vlan_id }} (Cisco IOS)
      cisco.ios.ios_l2_interfaces:
        config:
{% if (interfaces_binding_mode | default('access')) == 'access' %}
{% for ifn in iface_names %}
          - name: "{{ ifn }}"
            mode: access
            access:
              vlan: "{{ vlan_id }}"
{% endfor %}
{% else %}
{% set trunk_vlans_csv = 'all' if (interfaces_binding_trunk_allowed_vlans is string and interfaces_binding_trunk_allowed_vlans == 'all') else (interfaces_binding_trunk_allowed_vlans | default([]) | map('string') | join(',')) %}
{% for ifn in iface_names %}
          - name: "{{ ifn }}"
            mode: trunk
            trunk:
              trunk_vlans: "{{ trunk_vlans_csv }}"
{% endfor %}
{% endif %}
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])
{% elif interfaces_config_with_vlan | length > 0 %}
    - name: Configure interfaces (Cisco IOS)
      cisco.ios.ios_l2_interfaces:
        config:
{{ interfaces_config_with_vlan_yaml }}
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])
{% endif %}
{% endif %}
{% if 'huawei_vrp' in vendors %}
    - name: Ensure VLAN {{ vlan_id }} exists (Huawei VRP)
      community.network.ce_config:
        lines:
          - vlan batch {{ vlan_id }}
          - vlan {{ vlan_id }}
          - name {{ vlan_name }}
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])

{% if interfaces_config_with_vlan_use_nettopo | default(false) %}
{% if (interfaces_binding_mode | default('access')) == 'access' %}
    - name: Configure all interfaces as access VLAN {{ vlan_id }} (Huawei VRP)
      community.network.ce_config:
        lines:
          - port link-type access
          - port default vlan {{ vlan_id }}
        parents: "interface {{ '{{ item }}' }}"
      loop: "{{ '{{ nettopo_interfaces | default([]) | rejectattr(''ip_address'', ''equalto'', (hostvars[inventory_hostname].ansible_host | default(''''))) | map(attribute=''name'') | map(''trim'') | reject(''equalto'', '''') | reject(''match'', ''(?i).*(management|mgmt|meth|vty|console).*'') | list }}' }}"
      loop_control:
        label: "{{ '{{ item }}' }}"
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
{% elif (interfaces_binding_mode | default('access')) == 'trunk' %}
    - name: Configure all interfaces as trunk (Huawei VRP)
      community.network.ce_config:
        lines:
          - port link-type trunk
          - port trunk allow-pass vlan {{ 'all' if (interfaces_binding_trunk_allowed_vlans is string and interfaces_binding_trunk_allowed_vlans == 'all') else (interfaces_binding_trunk_allowed_vlans | default([]) | map('string') | join(' ')) }}
{% if interfaces_binding_trunk_native_vlan is not none %}
          - port trunk pvid vlan {{ interfaces_binding_trunk_native_vlan }}
{% endif %}
        parents: "interface {{ '{{ item }}' }}"
      loop: "{{ '{{ nettopo_interfaces | default([]) | rejectattr(''ip_address'', ''equalto'', (hostvars[inventory_hostname].ansible_host | default(''''))) | map(attribute=''name'') | map(''trim'') | reject(''equalto'', '''') | reject(''match'', ''(?i).*(management|mgmt|meth|vty|console).*'') | list }}' }}"
      loop_control:
        label: "{{ '{{ item }}' }}"
      when:
        - inventory_hostname in groups.get('vendor_huawei_vrp', [])
{% endif %}
{% else %}
{% for iface in interfaces_config_with_vlan %}
{% if (iface.mode | default('access')) == 'access' %}
    - name: Configure {{ iface.name }} as access VLAN {{ vlan_id }} (Huawei VRP)
      community.network.ce_config:
        lines:
          - port link-type access
          - port default vlan {{ iface.access.vlan }}
        parents: interface {{ iface.name }}
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])
{% endif %}
{% endfor %}
{% for iface in interfaces_config_with_vlan %}
{% if (iface.mode | default('access')) == 'trunk' %}
    - name: Configure {{ iface.name }} as trunk (Huawei VRP)
      community.network.ce_config:
        lines:
          - port link-type trunk
          - port trunk allow-pass vlan {{ iface.trunk.trunk_vlans }}
{% if iface.trunk.native_vlan is defined and iface.trunk.native_vlan is not none %}
          - port trunk pvid vlan {{ iface.trunk.native_vlan }}
{% endif %}
        parents: interface {{ iface.name }}
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])
{% endif %}
{% endfor %}
{% endif %}
{% endif %}
{% if 'juniper_junos' in vendors %}
    - name: Ensure VLAN {{ vlan_id }} exists (Juniper Junos)
      juniper.device.junos_vlans:
        config:
          - name: "{{ vlan_name }}"
            vlan_id: "{{ vlan_id }}"
        state: merged
      when: inventory_hostname in groups.get('vendor_juniper_junos', [])

{% if interfaces_config_with_vlan_use_nettopo | default(false) %}
{% set iface_names = nettopo_interfaces | default([]) | rejectattr('ip_address', 'equalto', (hostvars[inventory_hostname].ansible_host | default(''))) | map(attribute='name') | map('trim') | reject('equalto', '') | reject('match', '(?i).*(management|mgmt|meth|vty|console).*') | list %}
    - name: Configure interfaces (Juniper Junos) [all interfaces]
      juniper.device.junos_l2_interfaces:
        config:
{% if (interfaces_binding_mode | default('access')) == 'access' %}
{% for ifn in iface_names %}
          - name: "{{ ifn }}"
            mode: access
            access:
              vlan: "{{ vlan_id }}"
{% endfor %}
{% else %}
{% set trunk_vlans_csv = 'all' if (interfaces_binding_trunk_allowed_vlans is string and interfaces_binding_trunk_allowed_vlans == 'all') else (interfaces_binding_trunk_allowed_vlans | default([]) | map('string') | join(',')) %}
{% for ifn in iface_names %}
          - name: "{{ ifn }}"
            mode: trunk
            trunk:
              trunk_vlans: "{{ trunk_vlans_csv }}"
{% endfor %}
{% endif %}
        state: merged
      when: inventory_hostname in groups.get('vendor_juniper_junos', [])
{% elif interfaces_config_with_vlan | length > 0 %}
    - name: Configure interfaces (Juniper Junos)
      juniper.device.junos_l2_interfaces:
        config:
{{ interfaces_config_with_vlan_yaml }}
        state: merged
      when: inventory_hostname in groups.get('vendor_juniper_junos', [])
{% endif %}
{% endif %}
