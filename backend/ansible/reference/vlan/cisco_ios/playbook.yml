---
# Same structure as job_15 — Cisco IOS section only. Only values (vlan_id, vlan_name, target_hosts) are substituted.
- name: Configure VLANs on access switches
  hosts: "{{ target_hosts }}"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Ensure VLAN {{ vlan_id }} exists (Cisco IOS)
      cisco.ios.ios_vlans:
        config:
          - vlan_id: '{{ vlan_id }}'
            name: '{{ vlan_name }}'
            state: active
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])

    - name: Configure access VLAN on Gi0/1 and Gi0/2 (Cisco IOS)
      cisco.ios.ios_l2_interfaces:
        config:
          - name: GigabitEthernet0/1
            mode: access
            access:
              vlan: '{{ vlan_id }}'
          - name: GigabitEthernet0/2
            mode: access
            access:
              vlan: '{{ vlan_id }}'
        state: merged
      when: inventory_hostname in groups.get('vendor_cisco_ios', [])
