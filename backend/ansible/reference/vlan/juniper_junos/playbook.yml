---
# Same structure as job_15 — Juniper Junos section only. Only values (vlan_id, vlan_name, target_hosts) are substituted.
- name: Configure VLANs on access switches
  hosts: "{{ target_hosts }}"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Ensure VLAN {{ vlan_id }} exists (Juniper Junos)
      juniper.device.junos_vlans:
        config:
          - name: '{{ vlan_name }}'
            vlan_id: '{{ vlan_id }}'
        state: merged
      when: inventory_hostname in groups.get('vendor_juniper_junos', [])

    - name: Configure access VLAN on ge-0/0/0 and ge-0/0/1 (Juniper Junos)
      juniper.device.junos_l2_interfaces:
        config:
          - name: ge-0/0/0
            access:
              vlan: '{{ vlan_id }}'
          - name: ge-0/0/1
            access:
              vlan: '{{ vlan_id }}'
        state: merged
      when: inventory_hostname in groups.get('vendor_juniper_junos', [])
