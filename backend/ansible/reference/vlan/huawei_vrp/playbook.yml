---
# Same structure as job_15 — Huawei VRP section only. Only values (vlan_id, vlan_name, target_hosts) are substituted.
- name: Configure VLANs on access switches
  hosts: "{{ target_hosts }}"
  gather_facts: no
  ignore_unreachable: true
  tasks:
    - name: Ensure VLAN {{ vlan_id }} exists (Huawei VRP)
      community.network.ce_config:
        lines:
          - vlan batch {{ vlan_id }}
          - vlan {{ vlan_id }}
          - name {{ vlan_name }}
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])

    - name: Configure access VLAN on Gi1/0/1 (Huawei VRP)
      community.network.ce_config:
        lines:
          - port link-type access
          - port default vlan {{ vlan_id }}
        parents: interface GigabitEthernet1/0/1
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])

    - name: Configure access VLAN on Gi1/0/2 (Huawei VRP)
      community.network.ce_config:
        lines:
          - port link-type access
          - port default vlan {{ vlan_id }}
        parents: interface GigabitEthernet1/0/2
      when: inventory_hostname in groups.get('vendor_huawei_vrp', [])
