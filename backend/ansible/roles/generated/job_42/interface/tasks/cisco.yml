---
# Shutdown each interface (Cisco IOS): use ios_interfaces with enabled: false
- name: Shutdown interface {{ item }} (Cisco IOS)
  cisco.ios.ios_interfaces:
    config:
      - name: "{{ item }}"
        enabled: false
    state: merged
  loop: "{{ interfaces_to_shutdown | default([]) }}"
  when: (interfaces_to_shutdown | default([])) | length > 0
