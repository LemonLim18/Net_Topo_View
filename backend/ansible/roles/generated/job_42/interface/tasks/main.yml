---
# Include vendor-specific interface shutdown tasks (one file per vendor)
- name: Cisco IOS interface shutdown
  include_tasks: cisco.yml
  when: (ansible_network_os | default('')) == 'ios'

- name: Huawei VRP (CE) interface shutdown
  include_tasks: huawei.yml
  when: (ansible_network_os | default('')) == 'ce'

- name: Juniper Junos interface shutdown
  include_tasks: juniper.yml
  when: (ansible_network_os | default('')) == 'junos'
