---
# Shutdown each interface (Huawei VRP / CE)
- name: Shutdown interface {{ item }} (Huawei VRP)
  community.network.ce_config:
    lines:
      - shutdown
    parents: "interface {{ item }}"
    state: merged
  loop: "{{ interfaces_to_shutdown | default([]) }}"
  when: (interfaces_to_shutdown | default([])) | length > 0
