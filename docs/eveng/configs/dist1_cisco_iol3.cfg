! ============================================================
! Dist_Cisco_SW1 — IOL L3 — COMPLETE CONFIG
! Mgmt: 192.168.1.42 (e0/0 → Cloud0)
! Block A distribution — serves Acc_Cisco_1, Acc_Cisco_2, Acc_Huawei_1
! ============================================================

hostname Dist_Cisco_SW1
ip domain-name cognishield.lab
no ip domain-lookup
service password-encryption
ip routing
username cognishield privilege 15 secret CogniShield@Lab2026
enable secret CogniShield@Lab2026

! --- VLANs ---
vlan 10
 name Engineering
vlan 20
 name Operations
vlan 100
 name Management

! --- Management (Cloud0) ---
interface Ethernet0/0
 description MGMT-CLOUD0-REAL-LAN
 no switchport
 ip address 192.168.1.42 255.255.255.0
 no shutdown

! --- Uplink to Core 1 (L3 routed) ---
interface Ethernet0/1
 description UPLINK-TO-CORE1
 no switchport
 ip address 10.0.1.2 255.255.255.252
 no shutdown

! --- Uplink to Core 2 (L3 routed) ---
interface Ethernet0/2
 description UPLINK-TO-CORE2
 no switchport
 ip address 10.0.2.2 255.255.255.252
 no shutdown

! --- Downlink to Acc_Huawei_1 (L2 trunk) ---
interface Ethernet0/3
 description DOWNLINK-TO-ACC-HUAWEI-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,100
 no shutdown

! --- Downlink to Acc_Cisco_2 (L2 trunk) ---
interface Ethernet1/0
 description DOWNLINK-TO-ACC-CISCO-2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,100
 no shutdown

! --- Inter-VLAN Routing SVIs (default gateways for Block A) ---
interface Vlan10
 description ENGINEERING-GW
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description OPERATIONS-GW
 ip address 10.10.20.1 255.255.255.0
 no shutdown

! --- SSH ---
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
line vty 0 4
 transport input ssh
 login local
 exec-timeout 30 0
line con 0
 login local
 exec-timeout 30 0

! --- SNMP v2c ---
snmp-server community cognishield RO
snmp-server location CogniShield-Lab-EVE-NG
snmp-server contact admin@cognishield.lab
snmp-server enable traps snmp linkdown linkup coldstart
snmp-server enable traps config <syslog> // For the Access Switch
snmp-server host 192.168.1.250 version 2c cognishield

! --- LLDP + CDP ---
lldp run
cdp run

! --- Syslog ---
logging host 192.168.1.250 transport udp port 6514
logging trap informational
logging source-interface Ethernet0/0

! --- NTP ---
ntp server 192.168.1.3

! --- OSPF ---
router ospf 1
 router-id 192.168.1.42
 network 10.0.1.0 0.0.0.3 area 0
 network 10.0.2.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 192.168.1.0 0.0.0.255 area 0
 passive-interface Ethernet0/0
 passive-interface Ethernet0/3
 passive-interface Ethernet1/0
 passive-interface Ethernet1/1
 passive-interface Vlan10
 passive-interface Vlan20

end
write memory
