! ============================================================
! Cisco_Core_1 — CSR 1000v — COMPLETE CONFIG
! Mgmt: 192.168.1.40 (Gi6 → Cloud0)
! ============================================================
! NOTE: Your running config already has hostname, credentials,
! interfaces Gi1–Gi6. This adds the MISSING services.
! Paste only what you don't already have.
! ============================================================

! --- Already configured (verify) ---
hostname Cisco_Core_1
ip domain-name cognishield.lab
no ip domain-lookup
service password-encryption
username cognishield privilege 15 secret CogniShield@Lab2026
enable secret CogniShield@Lab2026

! --- Interfaces (already configured — shown for reference) ---
interface GigabitEthernet1
 description TO-CORE-R2
 ip address 10.0.0.1 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet2
 description TO-DIST-CISCO-SW1
 ip address 10.0.1.1 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet3
 description TO-DIST-HUAWEI-SW2
 ip address 10.0.1.5 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet4
 description TO-DIST-CISCO-SW3
 ip address 10.1.1.9 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet5
 description TO-DIST-HUAWEI-SW4
 ip address 10.1.1.13 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet6
 description MGMT-CLOUD0-REAL-LAN
 ip address 192.168.1.40 255.255.255.0
 no ip proxy-arp
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown

! ============================================================
! ADD THE FOLLOWING (paste into config mode):
! ============================================================

! --- SSH (fix VTY lines) ---
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
line vty 0 15
 transport input ssh
 login local
 exec-timeout 30 0
line con 0
 login local
 exec-timeout 30 0

! --- SNMP v2c ---
snmp-server community cognishield RO
snmp-server location CogniShield-Lab-EVE-NG
snmp-server contact admin@cognishield.lab
snmp-server enable traps snmp linkdown linkup coldstart
snmp-server enable traps config
snmp-server host 192.168.1.250 version 2c cognishield

! --- LLDP + CDP ---
lldp run
cdp run

! --- Syslog ---
logging host 192.168.1.250 transport udp port 6514
logging trap informational
logging source-interface GigabitEthernet6

! --- NTP ---
ntp server 192.168.1.3

! --- OSPF ---
router ospf 1
 router-id 192.168.1.40
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.1.0 0.0.0.3 area 0
 network 10.0.1.4 0.0.0.3 area 0
 network 10.1.1.8 0.0.0.3 area 0
 network 10.1.1.12 0.0.0.3 area 0
 network 192.168.1.0 0.0.0.255 area 0
 passive-interface GigabitEthernet6

end
write memory
