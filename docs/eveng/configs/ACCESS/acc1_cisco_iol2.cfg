! ============================================================
! Acc_Cisco_1 — IOL L2 — COMPLETE CONFIG
! Mgmt: 192.168.1.46 (Vlan100 SVI, e0/0 → Cloud0 as access VLAN 100)
! Block A — uplink to Dist_Cisco_SW1 e0/3
! ============================================================

hostname Acc_Cisco_1
ip domain-name cognishield.lab
no ip domain-lookup
service password-encryption
username cognishield privilege 15 secret CogniShield@Lab2026
enable secret CogniShield@Lab2026

! --- VLANs ---
vlan 10
 name Engineering
vlan 20
 name Operations
vlan 30
 name Guest
vlan 100
 name Management

! --- Management port (Cloud0) — L2 access port on VLAN 100 ---
interface Ethernet0/0
 description MGMT-CLOUD0-ACCESS-VLAN100
 switchport mode access
 switchport access vlan 100
 no cdp enable
 no shutdown

! --- Management SVI (this is where the IP lives) ---
interface Vlan100
 description MGMT-SVI
 ip address 192.168.1.43 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.1.1

! --- Uplink to Dist_Cisco_SW1 (trunk) ---
interface Ethernet0/1
 description UPLINK-TO-DIST-CISCO-SW1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,100
 no shutdown

 ! --- Uplink to Dist_Huawei_SW2 (trunk) ---
interface Ethernet1/0
 description UPLINK-TO-DIST-HUAWEI-SW2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,100
 no shutdown

! --- Access ports ---
interface Ethernet0/2
 description ACCESS-PORT-VLAN10
 switchport mode access
 switchport access vlan 10
 no shutdown
!
interface Ethernet0/3
 description ACCESS-PORT-VLAN20
 switchport mode access
 switchport access vlan 20
 no shutdown

! --- SSH ---
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
line vty 0 4
 transport input ssh
 login local
 exec-timeout 30 0
line con 0
 login local
 exec-timeout 30 0

! --- SNMP v2c ---
snmp-server community cognishield RO
snmp-server location CogniShield-Lab-EVE-NG
snmp-server contact admin@cognishield.lab
snmp-server enable traps snmp linkdown linkup coldstart
snmp-server enable traps syslog
snmp-server host 192.168.1.250 version 2c cognishield

! --- LLDP + CDP ---
lldp run
cdp run

! --- Syslog ---
logging host 192.168.1.250 transport udp port 6514
logging trap informational
logging source-interface Vlan100

! --- NTP ---
ntp server 192.168.1.3

! --- NO OSPF on access layer ---

end
write memory
