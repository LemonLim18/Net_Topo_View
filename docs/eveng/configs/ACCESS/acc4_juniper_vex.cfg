## ============================================================
## Acc_Juniper_1 — Juniper vEX — COMPLETE CONFIG
## Mgmt: 192.168.1.51 (em0 → Cloud0)
## Block B — dual-homed to Dist_Cisco_SW3 (ge-0/0/0→e1/1) + Dist_Huawei_SW4 (ge-0/0/1→GE1/0/2)
## ============================================================

system {
    host-name Acc_Juniper_1;
    domain-name cognishield.lab;
    root-authentication {
        encrypted-password "$6$placeholder";
        /* set via: set system root-authentication plain-text-password → CogniShield@Lab2026 */
    }
    login {
        user cognishield {
            class super-user;
            authentication {
                encrypted-password "$6$placeholder";
                /* set via: set system login user cognishield authentication plain-text-password → CogniShield@Lab2026 */
            }
        }
    }
    services {
        ssh {
            protocol-version v2;
            connection-limit 10;
        }
        netconf {
            ssh;
        }
    }
    syslog {
        host 192.168.1.250 {
            port 6514;
            any info;
            facility-override local7;
        }
    }
    ntp {
        server 192.168.1.3;
    }
}

/* --- Management Interface (em0 → Cloud0) --- */
interfaces {
    fxp0 {
        description "MGMT-CLOUD0-REAL-LAN";
        unit 0 {
            family inet {
                address 192.168.1.51/24;
            }
        }
    }

    /* --- Uplink to Dist_Cisco_SW3 (trunk) --- */
    ge-0/0/0 {
        description "UPLINK-TO-DIST-CISCO-SW3";
        unit 0 {
            family ethernet-switching {
                port-mode trunk;
                vlan {
                    members [ vlan10 vlan40 vlan100 ];
                }
            }
        }
    }

    /* --- Uplink to Dist_Huawei_SW4 (trunk) --- */
    ge-0/0/1 {
        description "UPLINK-TO-DIST-HUAWEI-SW4";
        unit 0 {
            family ethernet-switching {
                port-mode trunk;
                vlan {
                    members [ vlan10 vlan40 vlan100 ];
                }
            }
        }
    }

    /* --- Access ports --- */
    ge-0/0/2 {
        description "ACCESS-PORT-VLAN10";
        unit 0 {
            family ethernet-switching {
                port-mode access;
                vlan {
                    members vlan10;
                }
            }
        }
    }
    ge-0/0/3 {
        description "ACCESS-PORT-VLAN40";
        unit 0 {
            family ethernet-switching {
                port-mode access;
                vlan {
                    members vlan40;
                }
            }
        }
    }
}

/* --- VLANs --- */
vlans {
    vlan10 {
        vlan-id 10;
        description "Engineering";
    }
    vlan40 {
        vlan-id 40;
        description "IoT";
    }
    vlan100 {
        vlan-id 100;
        description "Management";
    }
}

/* --- SNMP --- */
snmp {
    community cognishield {
        authorization read-only;
    }
    location "CogniShield-Lab-EVE-NG";
    contact "admin@cognishield.lab";
    trap-group cognishield-traps {
        targets {
            192.168.1.250;
        }
    }
}

/* --- LLDP --- */
protocols {
    lldp {
        interface all;
    }
}

/* --- Static default route for management reachability --- */
routing-options {
    static {
        route 0.0.0.0/0 next-hop 192.168.1.1;
    }
}

/* --- NO OSPF on access layer --- */
