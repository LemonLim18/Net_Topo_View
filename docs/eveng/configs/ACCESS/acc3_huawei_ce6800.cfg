#
# Acc_Huawei_1 — CE 6800 — COMPLETE CONFIG
# Mgmt: 192.168.1.48 (MEth0/0/0 → Cloud0)
# Block A — dual-homed to Dist_Cisco_SW1 (GE1/0/1→e1/1) + Dist_Huawei_SW2 (GE1/0/5→GE1/0/0)
# ============================================================

sysname Acc_Huawei_1

# --- VLANs ---
vlan batch 10 20 30 100

# --- Management ---
interface MEth0/0/0
 ip address 192.168.1.58 255.255.255.0
 undo shutdown

# interface GE1/0/0
interface GigabitEthernet1/0/0
 undo shutdown
 undo portswitch
 ip address 192.168.1.48 255.255.255.0
#

# --- Uplink to Dist_Huawei_SW2 (trunk) ---
interface GigabitEthernet1/0/5
 description UPLINK-TO-DIST-HUAWEI-SW2
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100
 undo shutdown
#

# --- Uplink to Dist_Cisco_SW1 (trunk) ---
interface GigabitEthernet1/0/1
 description UPLINK-TO-DIST-CISCO-SW1
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100
 undo shutdown
#

# --- Access ports ---
interface GigabitEthernet1/0/2
 description ACCESS-PORT-VLAN10
 port link-type access
 port default vlan 10
 undo shutdown
#
interface GigabitEthernet1/0/3
 description ACCESS-PORT-VLAN30
 port link-type access
 port default vlan 30
 undo shutdown
#

# --- AAA / Local User ---
aaa
 local-user cognishield password irreversible-cipher Admin@Lab2026
 local-user cognishield level 3
 local-user cognishield service-type ssh terminal http
#

# --- SSH ---
rsa local-key-pair create 2048
ssh user cognishield authentication-type password
ssh user cognishield service-type stelnet
stelnet server enable
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 idle-timeout 30 0

# --- SNMP v2c ---
snmp-agent
snmp-agent sys-info version v2c
snmp-agent mib-view included ALL_ACCESS iso
snmp-agent community read CogniShield@Lab2026 mib-view ALL_ACCESS
snmp-agent community write CogniShield@Lab2026 mib-view ALL_ACCESS
snmp-agent sys-info location CogniShield-Lab-EVE-NG
snmp-agent sys-info contact admin@cognishield.lab
snmp-agent target-host trap address udp-domain 192.168.1.250 params securityname cognishield v2c

# Telemetry
netconf
  protocol inbound ssh port 830
  work-mode yang

aaa
  local-user cognishield service-type ssh terminal snmp

# 2. Define what to monitor (Sensor Paths)
  sensor-group sensor1
    sensor-path huawei-devm:devm/cpuInfos/cpuInfo
    sensor-path huawei-devm:devm/memoryInfos/memoryInfo
    sensor-path huawei-ifm:ifm/interfaces/interface/ifStatistics
    sensor-path huawei-ifm:interfaces/interface
    sensor-path huawei-mac:mac/macAddrSummarys/macAddrSummary

# --- LLDP ---
lldp enable

# Used for understanding Non-LLDP packets
lldp mdn enable

# --- Syslog ---
info-center loghost 192.168.1.250 port 6514 facility local7

# --- NTP ---
undo ntp disable
ntp unicast-server 192.168.1.3

# --- NO OSPF on access layer ---

return
save
