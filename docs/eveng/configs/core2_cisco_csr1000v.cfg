! ============================================================
! Cisco_Core_2 — CSR 1000v — COMPLETE CONFIG
! Mgmt: 192.168.1.41 (Gi6 → Cloud0)
! ============================================================

hostname Cisco_Core_2
ip domain-name cognishield.lab
no ip domain-lookup
service password-encryption
username cognishield privilege 15 secret CogniShield@Lab2026
enable secret CogniShield@Lab2026

! --- Data-Plane Interfaces ---
interface GigabitEthernet1
 description TO-CORE-R1
 ip address 10.0.0.2 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet2
 description TO-DIST-CISCO-SW1
 ip address 10.0.2.1 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet3
 description TO-DIST-HUAWEI-SW2
 ip address 10.0.2.5 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet4
 description TO-DIST-CISCO-SW3
 ip address 10.0.2.9 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown
!
interface GigabitEthernet5
 description TO-DIST-HUAWEI-SW4
 ip address 10.0.2.13 255.255.255.252
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown

! --- Management (Cloud0) ---
interface GigabitEthernet6
 description MGMT-CLOUD0-REAL-LAN
 ip address 192.168.1.41 255.255.255.0
 no ip proxy-arp
 negotiation auto
 no mop enabled
 no mop sysid
 no shutdown

! --- SSH ---
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
line vty 0 15
 transport input ssh
 login local
 exec-timeout 30 0
line con 0
 login local
 exec-timeout 30 0

! --- SNMP v2c ---
snmp-server community cognishield RO
snmp-server location CogniShield-Lab-EVE-NG
snmp-server contact admin@cognishield.lab
snmp-server enable traps snmp linkdown linkup coldstart
snmp-server enable traps config
snmp-server host 192.168.1.250 version 2c cognishield

! --- LLDP + CDP ---
lldp run
cdp run

! --- Syslog ---
logging host 192.168.1.250 transport udp port 6514
logging trap informational
logging source-interface GigabitEthernet6

! --- NTP ---
ntp server 192.168.1.3

! --- OSPF ---
router ospf 1
 router-id 192.168.1.41
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.2.0 0.0.0.3 area 0
 network 10.0.2.4 0.0.0.3 area 0
 network 10.0.2.8 0.0.0.3 area 0
 network 10.0.2.12 0.0.0.3 area 0
 network 192.168.1.0 0.0.0.255 area 0
 passive-interface GigabitEthernet6

end
write memory
