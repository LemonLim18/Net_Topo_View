! ============================================================
! Acc_Cisco_4 — IOL L2 — COMPLETE CONFIG
! Mgmt: 192.168.1.50 (Vlan100 SVI, e0/0 → Cloud0 as access VLAN 100)
! Block B — uplink to Dist_Cisco_SW3 e1/0
! ============================================================

hostname Acc_Cisco_4
ip domain-name cognishield.lab
no ip domain-lookup
service password-encryption
username cognishield privilege 15 secret CogniShield@Lab2026
enable secret CogniShield@Lab2026

! --- VLANs ---
vlan 20
 name Operations
vlan 30
 name Guest
vlan 100
 name Management

! --- Management port (Cloud0) ---
interface Ethernet0/0
 description MGMT-CLOUD0-ACCESS-VLAN100
 switchport mode access
 switchport access vlan 100
 no shutdown

! --- Management SVI ---
interface Vlan100
 description MGMT-SVI
 ip address 192.168.1.50 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.1.1

! --- Uplink to Dist_Cisco_SW3 (trunk) ---
interface Ethernet0/1
 description UPLINK-TO-DIST-CISCO-SW3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 20,30,100
 no shutdown

! --- Access ports ---
interface Ethernet0/2
 description ACCESS-PORT-VLAN20
 switchport mode access
 switchport access vlan 20
 no shutdown
!
interface Ethernet0/3
 description ACCESS-PORT-VLAN30
 switchport mode access
 switchport access vlan 30
 no shutdown

! --- SSH ---
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
line vty 0 15
 transport input ssh
 login local
 exec-timeout 30 0
line con 0
 login local
 exec-timeout 30 0

! --- SNMP v2c ---
snmp-server community cognishield RO
snmp-server location CogniShield-Lab-EVE-NG
snmp-server contact admin@cognishield.lab
snmp-server enable traps snmp linkdown linkup coldstart
snmp-server enable traps config
snmp-server host 192.168.1.250 version 2c cognishield

! --- LLDP + CDP ---
lldp run
cdp run

! --- Syslog ---
logging host 192.168.1.250 transport udp port 6514
logging trap informational
logging source-interface Vlan100

! --- NTP ---
ntp server 192.168.1.3

end
write memory
