#
# Dist_Huawei_SW4 — CE 12800 — COMPLETE CONFIG
# Mgmt: 192.168.1.45 (MEth0/0/0 → Cloud0)
# Block B distribution — serves Acc_Cisco_3, Acc_Cisco_4, Acc_Juniper_1 (paired with Dist_Cisco_SW3)
# ============================================================

sysname Dist_Huawei_SW4

# --- Management ---
interface MEth0/0/0
 ip address 192.168.1.45 255.255.255.0
 undo shutdown
#

# --- VLANs ---
vlan batch 10 20 30 40 100

# --- Uplink to Core 1 (L3 routed) ---
interface GE1/0/0
 undo portswitch
 description UPLINK-TO-CORE1
 ip address 10.1.1.14 255.255.255.252
 undo shutdown
#

# --- Uplink to Core 2 (L3 routed) ---
interface GE1/0/1
 undo portswitch
 description UPLINK-TO-CORE2
 ip address 10.0.2.14 255.255.255.252
 undo shutdown
#

# --- Downlink to Acc_Juniper_1 (L2 trunk) ---
interface GE1/0/2
 description DOWNLINK-TO-ACC-JUNIPER-1
 port link-type trunk
 port trunk allow-pass vlan 10 40 100
 undo shutdown
#

# --- Downlink to Acc_Cisco_3 (L2 trunk) ---
interface GE1/0/3
 description DOWNLINK-TO-ACC-CISCO-3
 port link-type trunk
 port trunk allow-pass vlan 20 30 100
 undo shutdown
#

# --- Downlink to Acc_Cisco_4 (L2 trunk) ---
interface GE1/0/4
 description DOWNLINK-TO-ACC-CISCO-4
 port link-type trunk
 port trunk allow-pass vlan 20 30 100
 undo shutdown
#

# --- Peer Link to Dist_Cisco_SW3 (L2 trunk — all shared VLANs) ---
interface GE1/0/5
 description PEER-LINK-TO-DIST-CISCO-SW3
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 40 100
 undo shutdown
#

# --- Inter-VLAN Routing (VLANIF SVIs + VRRP) ---
# Dist_Huawei_SW4 = VRRP active for VLAN 10,40 (priority 110)
# Dist_Cisco_SW3 = VRRP active for VLAN 20,30 (priority 110)
#
interface Vlanif10
 description ENGINEERING-GW
 ip address 10.10.10.3 255.255.255.0
 vrrp vrid 10 virtual-ip 10.10.10.254
 vrrp vrid 10 priority 110
 vrrp vrid 10 preempt-mode timer-delay 30
#
interface Vlanif20
 description OPERATIONS-GW
 ip address 10.10.20.4 255.255.255.0
 vrrp vrid 20 virtual-ip 10.10.20.254
 vrrp vrid 20 priority 100
 vrrp vrid 20 preempt-mode timer-delay 30
#
interface Vlanif30
 description GUEST-GW
 ip address 10.10.30.4 255.255.255.0
 vrrp vrid 30 virtual-ip 10.10.30.254
 vrrp vrid 30 priority 100
 vrrp vrid 30 preempt-mode timer-delay 30
#
interface Vlanif40
 description IOT-GW
 ip address 10.10.40.1 255.255.255.0
 vrrp vrid 40 virtual-ip 10.10.40.254
 vrrp vrid 40 priority 110
 vrrp vrid 40 preempt-mode timer-delay 30
#

# --- AAA / Local User ---
aaa
 local-user cognishield password irreversible-cipher CogniShield@Lab2026
 local-user cognishield privilege level 15
 local-user cognishield service-type ssh terminal
#

# --- SSH ---
rsa local-key-pair create 2048
ssh user cognishield authentication-type password
ssh user cognishield service-type stelnet
stelnet server enable
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 idle-timeout 30 0

# --- SNMP v2c ---
snmp-agent
snmp-agent sys-info version v2c
snmp-agent mib-view included ALL_ACCESS iso
snmp-agent community read CogniShield@Lab2026 mib-view ALL_ACCESS
snmp-agent community write CogniShield@Lab2026 mib-view ALL_ACCESS
snmp-agent sys-info location CogniShield-Lab-EVE-NG
snmp-agent sys-info contact admin@cognishield.lab
snmp-agent target-host trap address udp-domain 192.168.1.250 params securityname cognishield v2c

# Telemetry
netconf
  protocol inbound ssh port 830
  work-mode yang

aaa
  local-user cognishield service-type ssh terminal snmp

telemetry
# 1. Define where to send the data (Your Telegraf IP)
  destination-group dest1
    ipv4-address 192.168.1.250 port 57400 protocol grpc no-tls

# 2. Define what to monitor (Sensor Paths)
  sensor-group sensor1
    sensor-path huawei-devm:devm/cpuInfos/cpuInfo
    sensor-path huawei-devm:devm/memoryInfos/memoryInfo
    sensor-path huawei-ifm:ifm/interfaces/interface/ifStatistics
    sensor-path huawei-ifm:interfaces/interface
    sensor-path huawei-mac:mac/macAddrSummarys/macAddrSummary

# 3. Create the subscription
  subscription sub1
    sensor-group sensor1 sample-interval 10000 # 10 seconds
    destination-group dest1
    encoding gpb

# --- LLDP ---
lldp enable

# Used for understanding Non-LLDP packets
lldp mdn enable

# --- Syslog ---
info-center loghost 192.168.1.250 port 6514 facility local7

# --- NTP ---
ntp-service unicast-server 192.168.1.3

# --- OSPF ---
ospf 1 router-id 192.168.1.45
 area 0.0.0.0
  network 10.1.1.12 0.0.0.3
  network 10.0.2.12 0.0.0.3
  network 10.10.10.0 0.0.0.255
  network 10.10.20.0 0.0.0.255
  network 10.10.30.0 0.0.0.255
  network 10.10.40.0 0.0.0.255
  network 192.168.1.0 0.0.0.255

return
save
