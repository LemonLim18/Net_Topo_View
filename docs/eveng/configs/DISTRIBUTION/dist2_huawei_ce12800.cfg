#
# Dist_Huawei_SW2 — CE 12800 — COMPLETE CONFIG
# Mgmt: 192.168.1.43 (MEth0/0/0 → Cloud0)
# Block A distribution — serves Acc_Huawei_1
# ============================================================
sys im
sysname Dist_Huawei_SW2

# --- Management ---
interface MEth0/0/0
 ip address 192.168.1.43 255.255.255.0
 undo shutdown
#

# --- VLANs ---
vlan batch 10 20 30 100

# --- Uplink to Core 1 (L3 routed) ---
interface GE1/0/1
 undo portswitch
 description UPLINK-TO-CORE1
 ip address 10.0.1.6 255.255.255.252
 undo shutdown
#

# --- Uplink to Core 2 (L3 routed) ---
interface GE1/0/2
 undo portswitch
 description UPLINK-TO-CORE2
 ip address 10.0.2.6 255.255.255.252
 undo shutdown
#

# --- Downlink to Acc_Cisco_1 (L2 trunk) ---
interface GE1/0/3
 description DOWNLINK-TO-ACC-CISCO-1
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100
 undo shutdown
#

# --- Downlink to Acc_Cisco_2 (L2 trunk) ---
interface GE1/0/4
 description DOWNLINK-TO-ACC-CISCO-2
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100
 undo shutdown
#

# --- Downlink to Acc_Huawei_1 (L2 trunk) ---
interface GE1/0/0
 description DOWNLINK-TO-ACC-HUAWEI-1
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100
 undo shutdown
#

# --- Peer Link to Dist_Cisco_SW1 (L2 trunk — all shared VLANs) ---
interface GE1/0/5
 description PEER-LINK-TO-DIST-CISCO-SW1
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 100
 undo shutdown
#

# --- Inter-VLAN Routing (VLANIF SVIs + VRRP) ---
# Dist_Huawei_SW2 = VRRP active for VLAN 30 (priority 110)
# Dist_Cisco_SW1 = VRRP active for VLAN 10,20 (priority 110)
#
interface Vlanif10
 description ENGINEERING-GW
 ip address 10.10.10.2 255.255.255.0
 vrrp vrid 10 virtual-ip 10.10.10.254
 vrrp vrid 10 priority 100
 vrrp vrid 10 preempt timer delay 30
#
interface Vlanif20
 description OPERATIONS-GW
 ip address 10.10.20.2 255.255.255.0
 vrrp vrid 20 virtual-ip 10.10.20.254
 vrrp vrid 20 priority 100
 vrrp vrid 20 preempt timer delay 30
#
interface Vlanif30
 description GUEST-GW
 ip address 10.10.30.1 255.255.255.0
 vrrp vrid 30 virtual-ip 10.10.30.254
 vrrp vrid 30 priority 110
 vrrp vrid 30 preempt timer delay 30
#

# --- AAA / Local User ---
aaa
 local-user cognishield password irreversible-cipher Admin@Lab2026
;  local-user cognishield privilege level 15
 local-user cognishield level 3
 local-user cognishield service-type ssh terminal
#

# --- SSH ---
rsa local-key-pair create [2048]
ssh user cognishield authentication-type password
ssh user cognishield service-type stelnet
stelnet server enable
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 idle-timeout 30 0

# --- SNMP v2c ---
snmp-agent community read CogniShield@Lab2026
snmp-agent sys-info location CogniShield-Lab-EVE-NG
snmp-agent sys-info contact admin@cognishield.lab
snmp-agent target-host trap address udp-domain 192.168.1.250 params securityname cognishield v2c

# --- LLDP ---
lldp enable

# Used for understanding Non-LLDP packets
lldp mdn enable

# --- Syslog ---
info-center loghost 192.168.1.250 port 6514 facility local7

# --- NTP ---
undo ntp disable
ntp unicast-server 192.168.1.3

# --- OSPF ---
ospf 1 router-id 192.168.1.43
 area 0.0.0.0
  network 10.0.1.4 0.0.0.3
  network 10.0.2.4 0.0.0.3
  network 10.10.10.0 0.0.0.255
  network 10.10.20.0 0.0.0.255
  network 10.10.30.0 0.0.0.255
  network 192.168.1.0 0.0.0.255

return
save
