# ═══════════════════════════════════════════════════════════════
# Telegraf Configuration — CogniShield / NetTopoView
#
# Deployed on: 192.168.1.250 (SDN + InfluxDB + Telegraf VM)
#
# Reads env vars:
#   INFLUXDB_URL, INFLUXDB_TOKEN, INFLUXDB_ORG, INFLUXDB_BUCKET
#   SNMP_COMMUNITY (default: cognishield)
#
# EVE-NG 3-Tier Campus Topology (12 devices):
#   Core:         Cisco_Core_1 (.40),  Cisco_Core_2 (.41)    — CSR 1000v
#   Distribution: Dist_Cisco_SW1 (.42), Dist_Huawei_SW2 (.43),
#                 Dist_Cisco_SW3 (.44), Dist_Huawei_SW4 (.45) — IOL L3 + CE 12800
#   Access:       Acc_Cisco_1 (.46), Acc_Cisco_2 (.47),
#                 Acc_Huawei_1 (.48),                         — IOL L2 + CE 6800
#                 Acc_Cisco_3 (.49), Acc_Cisco_4 (.50),
#                 Acc_Juniper_1 (.51)                         — IOL L2 + vEX
# ═══════════════════════════════════════════════════════════════

# ── Global Agent ─────────────────────────────────────────────
[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "10s"
  flush_jitter = "5s"
  precision = "1s"
  hostname = "CogniShield-Telegraf"
  omit_hostname = false

# ── Output: InfluxDB v2 ─────────────────────────────────────
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "10s"

# ══════════════════════════════════════════════════════════════
# INPUT: SNMP — System Info (all 12 devices, standard MIBs)
# ══════════════════════════════════════════════════════════════
[[inputs.snmp]]
  agents = [
    "192.168.1.40:161", "192.168.1.41:161",
    "192.168.1.42:161", "192.168.1.43:161", "192.168.1.44:161", "192.168.1.45:161",
    "192.168.1.46:161", "192.168.1.47:161", "192.168.1.48:161",
    "192.168.1.49:161", "192.168.1.50:161", "192.168.1.51:161"
  ]
  version = 2
  community = "${SNMP_COMMUNITY:-cognishield}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "snmp_system"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid = "RFC1213-MIB::sysUpTime.0"

  [[inputs.snmp.field]]
    name = "sysDescr"
    oid = "RFC1213-MIB::sysDescr.0"

  [[inputs.snmp.field]]
    name = "sysContact"
    oid = "RFC1213-MIB::sysContact.0"

  [[inputs.snmp.field]]
    name = "sysLocation"
    oid = "RFC1213-MIB::sysLocation.0"

# ══════════════════════════════════════════════════════════════
# INPUT: SNMP — Cisco CPU (Core + Cisco Dist + Cisco Access)
# Devices: .40, .41 (CSR Core), .42, .44 (IOL L3 Dist),
#          .46, .47, .49, .50 (IOL L2 Access)
# ══════════════════════════════════════════════════════════════
[[inputs.snmp]]
  agents = [
    "192.168.1.40:161", "192.168.1.41:161",
    "192.168.1.42:161", "192.168.1.44:161",
    "192.168.1.46:161", "192.168.1.47:161", "192.168.1.49:161", "192.168.1.50:161"
  ]
  version = 2
  community = "${SNMP_COMMUNITY:-cognishield}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "cisco_cpu"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "cpu_table"
    inherit_tags = ["hostname"]
    [[inputs.snmp.table.field]]
      name = "cpu_5sec"
      oid = "CISCO-PROCESS-MIB::cpmCPUTotal5secRev"
    [[inputs.snmp.table.field]]
      name = "cpu_1min"
      oid = "CISCO-PROCESS-MIB::cpmCPUTotal1minRev"
    [[inputs.snmp.table.field]]
      name = "cpu_5min"
      oid = "CISCO-PROCESS-MIB::cpmCPUTotal5minRev"

# ══════════════════════════════════════════════════════════════
# INPUT: SNMP — Cisco Memory (same Cisco devices)
# ══════════════════════════════════════════════════════════════
[[inputs.snmp]]
  agents = [
    "192.168.1.40:161", "192.168.1.41:161",
    "192.168.1.42:161", "192.168.1.44:161",
    "192.168.1.46:161", "192.168.1.47:161", "192.168.1.49:161", "192.168.1.50:161"
  ]
  version = 2
  community = "${SNMP_COMMUNITY:-cognishield}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "cisco_memory"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "memory_table"
    inherit_tags = ["hostname"]
    [[inputs.snmp.table.field]]
      name = "mem_name"
      oid = "CISCO-MEMORY-POOL-MIB::ciscoMemoryPoolName"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "mem_used"
      oid = "CISCO-MEMORY-POOL-MIB::ciscoMemoryPoolUsed"
    [[inputs.snmp.table.field]]
      name = "mem_free"
      oid = "CISCO-MEMORY-POOL-MIB::ciscoMemoryPoolFree"

# ══════════════════════════════════════════════════════════════
# INPUT: SNMP — Huawei CPU + Memory (CE 12800 Dist + CE 6800 Access)
# Devices: .43 (Dist_Huawei_SW2), .45 (Dist_Huawei_SW4), .48 (Acc_Huawei_1)
# ══════════════════════════════════════════════════════════════
[[inputs.snmp]]
  agents = [
    "192.168.1.43:161", "192.168.1.45:161", "192.168.1.48:161"
  ]
  version = 2
  community = "${SNMP_COMMUNITY:-cognishield}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "huawei_cpu"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  # HUAWEI-ENTITY-EXTENT-MIB — hwEntityCpuUsage
  [[inputs.snmp.field]]
    name = "cpu_usage"
    oid = "1.3.6.1.4.1.2011.5.25.31.1.1.1.1.5.67108873"

  # HUAWEI-ENTITY-EXTENT-MIB — hwEntityMemUsage
  [[inputs.snmp.field]]
    name = "mem_usage_pct"
    oid = "1.3.6.1.4.1.2011.5.25.31.1.1.1.1.7.67108873"

# ══════════════════════════════════════════════════════════════
# INPUT: SNMP — Juniper CPU + Memory (vEX Access)
# Device: .51 (Acc_Juniper_1)
# ══════════════════════════════════════════════════════════════
[[inputs.snmp]]
  agents = [
    "192.168.1.51:161"
  ]
  version = 2
  community = "${SNMP_COMMUNITY:-cognishield}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "juniper_cpu"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  # JUNIPER-MIB jnxOperatingCPU — Routing Engine
  [[inputs.snmp.field]]
    name = "cpu_load"
    oid = "1.3.6.1.4.1.2636.3.1.13.1.8.9.1.0.0"

  # JUNIPER-MIB jnxOperatingMemory
  [[inputs.snmp.field]]
    name = "mem_usage_pct"
    oid = "1.3.6.1.4.1.2636.3.1.13.1.11.9.1.0.0"

# ══════════════════════════════════════════════════════════════
# INPUT: SNMP — Interface Table (all 12 devices, IF-MIB)
# ══════════════════════════════════════════════════════════════
[[inputs.snmp]]
  agents = [
    "192.168.1.40:161", "192.168.1.41:161",
    "192.168.1.42:161", "192.168.1.43:161", "192.168.1.44:161", "192.168.1.45:161",
    "192.168.1.46:161", "192.168.1.47:161", "192.168.1.48:161",
    "192.168.1.49:161", "192.168.1.50:161", "192.168.1.51:161"
  ]
  version = 2
  community = "${SNMP_COMMUNITY:-cognishield}"
  interval = "60s"
  timeout = "15s"
  retries = 2
  name = "snmp_interfaces"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "interface_table"
    inherit_tags = ["hostname"]

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "IF-MIB::ifDescr"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifAlias"
      oid = "IF-MIB::ifAlias"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "IF-MIB::ifOperStatus"

    [[inputs.snmp.table.field]]
      name = "ifAdminStatus"
      oid = "IF-MIB::ifAdminStatus"

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = "IF-MIB::ifHCInOctets"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = "IF-MIB::ifHCOutOctets"

    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = "IF-MIB::ifInErrors"

    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = "IF-MIB::ifOutErrors"

    [[inputs.snmp.table.field]]
      name = "ifInDiscards"
      oid = "IF-MIB::ifInDiscards"

    [[inputs.snmp.table.field]]
      name = "ifOutDiscards"
      oid = "IF-MIB::ifOutDiscards"

    [[inputs.snmp.table.field]]
      name = "ifSpeed"
      oid = "IF-MIB::ifSpeed"

# ══════════════════════════════════════════════════════════════
# INPUT: Syslog Receiver (devices send to 192.168.1.250:6514)
# ══════════════════════════════════════════════════════════════
[[inputs.syslog]]
  server = "udp://:6514"

  [inputs.syslog.tags]
    source = "network_devices"

# ══════════════════════════════════════════════════════════════
# INPUT: NetFlow v9 / IPFIX Receiver
# ══════════════════════════════════════════════════════════════
[[inputs.netflow]]
  service_address = "udp://:2055"
  protocol = "netflow v9"

# ══════════════════════════════════════════════════════════════
# INPUT: Cisco gRPC Model-Driven Telemetry (placeholder)
# Enable when CSR 1000v has gRPC configured
# ══════════════════════════════════════════════════════════════
# [[inputs.cisco_telemetry_mdt]]
#   transport = "grpc"
#   service_address = ":57000"

# ══════════════════════════════════════════════════════════════
# INPUT: ICMP Ping — reachability for all devices + VMs
# ══════════════════════════════════════════════════════════════
[[inputs.ping]]
  urls = [
    # Core
    "192.168.1.40", "192.168.1.41",
    # Distribution
    "192.168.1.42", "192.168.1.43", "192.168.1.44", "192.168.1.45",
    # Access
    "192.168.1.46", "192.168.1.47", "192.168.1.48",
    "192.168.1.49", "192.168.1.50", "192.168.1.51",
    # Infrastructure VMs
    "192.168.1.248",   # EVE-NG
    "192.168.1.250",   # This VM (self)
    "192.168.1.252",   # NetBox + Prometheus
    "192.168.1.3"      # CogniShield host PC
  ]
  count = 3
  ping_interval = 1.0
  timeout = 5.0
  interval = "60s"

