
# Global Agent Configuration
[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "NetTopoController"
  omit_hostname = false

# Output to InfluxDB
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "$INFLUX_TOKEN"
  organization = "net_topo_org"
  bucket = "net_metrics"

# -------------------------------------------------------------
# GLOBAL LISTENERS (Push Telemetry)
# -------------------------------------------------------------

# 1. Syslog Receiver
[[inputs.syslog]]
  server = "tcp://:6514"
  syslog_standard = "RFC5424"

# 2. NetFlow/IPFIX Receiver
[[inputs.netflow]]
  service_address = "udp://:2055"
  protocol = "v9"

# 3. Model-Driven Telemetry (Cisco MDT via GRPC)
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57000"


# -------------------------------------------------------------
# POLLERS: SNMP
# -------------------------------------------------------------
[[inputs.snmp]]
  agents = ["192.168.1.1:161"]
  version = 2
  community = "public"
  interval = "60s"
  timeout = "5s"
  retries = 3

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid = "RFC1213-MIB::sysUpTime.0"

  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = ["hostname"]
    oid = "IF-MIB::ifTable"
    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "IF-MIB::ifDescr"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "IF-MIB::ifInOctets"
    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "IF-MIB::ifOutOctets"

# -------------------------------------------------------------
# POLLERS: ICMP (Ping)
# -------------------------------------------------------------
[[inputs.ping]]
  urls = ["192.168.1.1"]
  count = 3
  ping_interval = 1.0
  timeout = 1.0

# -------------------------------------------------------------
# POLLERS: gNMI
# -------------------------------------------------------------

[[inputs.gnmi]]
  addresses = ["192.168.1.1:57400"]
  username = "admin"
  password = "password"
  # Default subscription
  [[inputs.gnmi.subscription]]
    name = "interfaces"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "10s"
