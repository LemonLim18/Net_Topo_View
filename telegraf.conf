
# ═══════════════════════════════════════════════════════════════
# Telegraf Configuration — CogniShield / NetTopoView
#
# Reads env vars from docker-compose:
#   INFLUXDB_URL, INFLUXDB_TOKEN, INFLUXDB_ORG, INFLUXDB_BUCKET
#
# Input Plugins:
#   1. SNMP Polling (CPU, Memory, Interfaces)
#   2. Syslog Receiver (RFC5424)
#   3. NetFlow/IPFIX Receiver
#   4. Cisco MDT (gRPC Telemetry)
#   5. ICMP Ping
#   6. gNMI (OpenConfig)
# ═══════════════════════════════════════════════════════════════

# ── Global Agent ─────────────────────────────────────────────
[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "5s"
  flush_interval = "10s"
  flush_jitter = "5s"
  precision = "1s"
  hostname = "NetTopoController"
  omit_hostname = false

# ── Output: InfluxDB v2 ─────────────────────────────────────
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "10s"

  ## Optional TLS Config
  # tls_ca = "/etc/telegraf/ca.pem"
  # insecure_skip_verify = false

# ══════════════════════════════════════════════════════════════
# INPUT: SNMP Polling (v2c / v3)
# ══════════════════════════════════════════════════════════════

# ── System-level metrics ─────────────────────────────────────
[[inputs.snmp]]
  agents = ["${SNMP_TARGETS:-192.168.1.1:161}"]
  version = 2
  community = "${SNMP_COMMUNITY:-public}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "snmp_system"

  # System identification
  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "uptime"
    oid = "RFC1213-MIB::sysUpTime.0"

  [[inputs.snmp.field]]
    name = "sysDescr"
    oid = "RFC1213-MIB::sysDescr.0"

# ── CPU utilization (Cisco cpmCPUTotal) ──────────────────────
[[inputs.snmp]]
  agents = ["${SNMP_TARGETS:-192.168.1.1:161}"]
  version = 2
  community = "${SNMP_COMMUNITY:-public}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "cpu"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  # Cisco CPU 5-second utilization
  [[inputs.snmp.table]]
    name = "cpu_table"
    inherit_tags = ["hostname"]
    [[inputs.snmp.table.field]]
      name = "cpu_5sec"
      oid = "CISCO-PROCESS-MIB::cpmCPUTotal5secRev"
    [[inputs.snmp.table.field]]
      name = "cpu_1min"
      oid = "CISCO-PROCESS-MIB::cpmCPUTotal1minRev"
    [[inputs.snmp.table.field]]
      name = "cpu_5min"
      oid = "CISCO-PROCESS-MIB::cpmCPUTotal5minRev"

# ── Memory utilization (Cisco MEMORY-POOL) ───────────────────
[[inputs.snmp]]
  agents = ["${SNMP_TARGETS:-192.168.1.1:161}"]
  version = 2
  community = "${SNMP_COMMUNITY:-public}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "memory"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "memory_pool"
    inherit_tags = ["hostname"]
    [[inputs.snmp.table.field]]
      name = "pool_name"
      oid = "CISCO-MEMORY-POOL-MIB::ciscoMemoryPoolName"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "mem_used"
      oid = "CISCO-MEMORY-POOL-MIB::ciscoMemoryPoolUsed"
    [[inputs.snmp.table.field]]
      name = "mem_free"
      oid = "CISCO-MEMORY-POOL-MIB::ciscoMemoryPoolFree"

# ── Interface counters (IF-MIB) ──────────────────────────────
[[inputs.snmp]]
  agents = ["${SNMP_TARGETS:-192.168.1.1:161}"]
  version = 2
  community = "${SNMP_COMMUNITY:-public}"
  interval = "60s"
  timeout = "10s"
  retries = 3
  name = "interface"

  [[inputs.snmp.field]]
    name = "hostname"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  [[inputs.snmp.table]]
    name = "if_table"
    inherit_tags = ["hostname"]
    oid = "IF-MIB::ifTable"
    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "IF-MIB::ifDescr"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "ifOperStatus"
      oid = "IF-MIB::ifOperStatus"
    [[inputs.snmp.table.field]]
      name = "ifAdminStatus"
      oid = "IF-MIB::ifAdminStatus"
    [[inputs.snmp.table.field]]
      name = "ifInOctets"
      oid = "IF-MIB::ifInOctets"
    [[inputs.snmp.table.field]]
      name = "ifOutOctets"
      oid = "IF-MIB::ifOutOctets"
    [[inputs.snmp.table.field]]
      name = "ifInErrors"
      oid = "IF-MIB::ifInErrors"
    [[inputs.snmp.table.field]]
      name = "ifOutErrors"
      oid = "IF-MIB::ifOutErrors"
    [[inputs.snmp.table.field]]
      name = "ifInDiscards"
      oid = "IF-MIB::ifInDiscards"
    [[inputs.snmp.table.field]]
      name = "ifOutDiscards"
      oid = "IF-MIB::ifOutDiscards"
    [[inputs.snmp.table.field]]
      name = "ifSpeed"
      oid = "IF-MIB::ifSpeed"

  # 64-bit counters for high-speed interfaces
  [[inputs.snmp.table]]
    name = "if_hc_table"
    inherit_tags = ["hostname"]
    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "IF-MIB::ifDescr"
      is_tag = true
    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = "IF-MIB::ifHCInOctets"
    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = "IF-MIB::ifHCOutOctets"
    [[inputs.snmp.table.field]]
      name = "ifHighSpeed"
      oid = "IF-MIB::ifHighSpeed"

# ══════════════════════════════════════════════════════════════
# INPUT: Push Telemetry Listeners
# ══════════════════════════════════════════════════════════════

# ── Syslog Receiver ──────────────────────────────────────────
[[inputs.syslog]]
  server = "tcp://:6514"
  syslog_standard = "RFC5424"

# ── NetFlow/IPFIX Receiver ───────────────────────────────────
[[inputs.netflow]]
  service_address = "udp://:2055"
  protocol = "v9"

# ── Cisco Model-Driven Telemetry (gRPC) ─────────────────────
[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57000"

# ══════════════════════════════════════════════════════════════
# INPUT: Active Probes
# ══════════════════════════════════════════════════════════════

# ── ICMP Ping ────────────────────────────────────────────────
[[inputs.ping]]
  urls = ["${PING_TARGETS:-192.168.1.1}"]
  count = 3
  ping_interval = 1.0
  timeout = 2.0
  interval = "60s"

