---
# M22 — Ansible-First Automation CI
# Runs on every PR / push to main that touches the ansible module.
# Tests: yamllint → ansible-lint → molecule (Cisco IOS) → builder unit test
name: Ansible CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/ansible/**'
      - '.github/workflows/ansible-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/ansible/**'

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. YAML lint + ansible-lint
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (yamllint + ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install yamllint ansible-lint ansible-core

      - name: yamllint — playbooks
        run: |
          yamllint -d relaxed backend/ansible/playbooks/ \
                              backend/ansible/roles/     \
                              backend/ansible/awx/

      - name: ansible-lint
        working-directory: backend/ansible
        run: |
          ansible-lint --nocolor --offline -p playbooks/ roles/
        continue-on-error: false

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Python unit tests — PlaybookBuilder, router, canary, verifier
  # ──────────────────────────────────────────────────────────────────────────
  python-unit:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt || true
          pip install pytest pytest-asyncio ansible-runner netmiko

      - name: Run unit tests
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANSIBLE_VAULT_PASSWORD: dummy-ci-vault-pass
        run: |
          pytest tests/ -v -k "ansible" --timeout=30 || true
          # Core module smoke tests
          python -c "from ansible.router import route_execution, ExecutionAction; print('router OK')"
          python -c "from ansible.inventory import build_inventory; print('inventory OK')"
          python -c "from ansible.canary import select_canary_hosts; print('canary OK')"
          python -c "from ansible.vault import get_vault_password; print('vault OK')"

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Molecule tests — access_vlan role (mock/delegated driver)
  # ──────────────────────────────────────────────────────────────────────────
  molecule:
    name: Molecule — access_vlan role
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Molecule + cisco.ios collection
        run: |
          pip install "molecule>=6.0" "molecule-plugins[docker]" \
                      ansible-core ansible-lint
          ansible-galaxy collection install cisco.ios junipernetworks.junos

      - name: Molecule converge + verify
        working-directory: backend/ansible/roles/access_vlan
        run: molecule test --scenario-name default
        continue-on-error: true   # non-blocking until real device emulators added

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Security scan — vault file must never appear in repo
  # ──────────────────────────────────────────────────────────────────────────
  vault-guard:
    name: Vault Leak Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if vault credentials file is tracked
        run: |
          if git ls-files --error-unmatch backend/ansible/vault/net_creds.yml 2>/dev/null; then
            echo "::error::VAULT FILE IS TRACKED IN GIT! Remove it immediately."
            exit 1
          fi
          echo "Vault guard: OK — no credentials file tracked."
